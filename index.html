    // --- FINANCIAL SUMMARY & REPORTS VIEW ---
    function DashboardAnalytics({ transactions, inventory, onDeleteTransaction }) {
      // Setup state for date filtering
      const getInitialDateStr = () => {
        const wibOffset = 7 * 60 * 60 * 1000; // 7 hours in ms
        const wibDate = new Date(Date.now() + wibOffset);
        // If before 06:00 AM WIB, it belongs to the previous business day
        if (wibDate.getUTCHours() < 6) {
           wibDate.setUTCDate(wibDate.getUTCDate() - 1);
        }
        return `${wibDate.getUTCFullYear()}-${String(wibDate.getUTCMonth()+1).padStart(2,'0')}-${String(wibDate.getUTCDate()).padStart(2,'0')}`;
      };

      const [selectedDateStr, setSelectedDateStr] = useState(getInitialDateStr());

      const getCycleRange = (dateStr) => {
        if (!dateStr) return { startMs: 0, endMs: 0 };
        const [yyyy, mm, dd] = dateStr.split('-').map(Number);
        const wibOffset = 7 * 60 * 60 * 1000;
        // Start time is 06:00:00 WIB on the selected date
        const startMs = Date.UTC(yyyy, mm - 1, dd, 6, 0, 0, 0) - wibOffset;
        const endMs = startMs + (24 * 60 * 60 * 1000);
        return { startMs, endMs };
      };

      const { startMs: cycleStartMs, endMs: cycleEndMs } = getCycleRange(selectedDateStr);

      const filteredTrx = transactions.filter(t => t.timestamp >= cycleStartMs && t.timestamp < cycleEndMs);
      
      const totalRevenue = filteredTrx.reduce((sum, t) => sum + t.grandTotal, 0);
      const rentalRevenue = filteredTrx.reduce((sum, t) => sum + (t.rentalTotal || 0), 0);
      const fnbRevenue = filteredTrx.reduce((sum, t) => sum + (t.fnbTotal || 0), 0);
      
      const fnbCost = filteredTrx.reduce((sum, t) => {
        let cost = 0;
        if (t.fnbCostTotal !== undefined) {
          cost = t.fnbCostTotal;
        } else if (t.items) {
          cost = t.items.reduce((s, order) => s + (order.item.cost * order.qty), 0);
        } else if (t.fnbOrders) {
          cost = t.fnbOrders.reduce((s, order) => s + (order.item.cost * order.qty), 0);
        }
        return sum + cost;
      }, 0);

      const fnbProfit = fnbRevenue - fnbCost;
      const totalProfit = rentalRevenue + fnbProfit; 
      
      const qrisRevenue = filteredTrx.filter(t => t.paymentMethod === 'QRIS').reduce((sum, t) => sum + t.grandTotal, 0);
      const cashRevenue = filteredTrx.filter(t => t.paymentMethod === 'Cash').reduce((sum, t) => sum + t.grandTotal, 0);

      const unitProfit = {};
      filteredTrx.filter(t => t.type === 'rental').forEach(t => {
        if (!unitProfit[t.unit_id]) {
          unitProfit[t.unit_id] = { name: t.unit_name, rental: 0, fnb: 0, total: 0 };
        }
        unitProfit[t.unit_id].rental += t.rentalTotal;
        unitProfit[t.unit_id].fnb += t.fnbTotal;
        unitProfit[t.unit_id].total += t.grandTotal;
      });

      // Format Active Cycle display period in WIB (UTC+7)
      const cycleStartWib = new Date(cycleStartMs + 7 * 60 * 60 * 1000);
      const cycleEndWib = new Date(cycleEndMs + 7 * 60 * 60 * 1000);
      
      const formatDateWib = (date) => {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${days[date.getUTCDay()]}, ${date.getUTCDate()} ${months[date.getUTCMonth()]} ${date.getUTCFullYear()} - ${date.getUTCHours().toString().padStart(2, '0')}:${date.getUTCMinutes().toString().padStart(2, '0')} WIB`;
      };

      const handlePrevDay = () => {
        const [yyyy, mm, dd] = selectedDateStr.split('-').map(Number);
        const d = new Date(Date.UTC(yyyy, mm - 1, dd - 1));
        setSelectedDateStr(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
      };
      
      const handleNextDay = () => {
        const [yyyy, mm, dd] = selectedDateStr.split('-').map(Number);
        const d = new Date(Date.UTC(yyyy, mm - 1, dd + 1));
        setSelectedDateStr(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
      };

      return (
        <div className="space-y-6 animate-in">
          <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-2">
            <div>
              <h2 className="text-2xl font-bold text-white">Daily Summary Analytics</h2>
              <p className="text-slate-400 text-sm mt-0.5">
                Active Cycle: <span className="text-yellow-400 font-semibold">{formatDateWib(cycleStartWib)}</span> to <span className="text-yellow-400 font-semibold">{formatDateWib(cycleEndWib)}</span>
              </p>
            </div>
            
            <div className="flex items-center space-x-1 bg-slate-900 border border-slate-700 rounded-lg p-1 w-fit shadow-lg">
              <button onClick={handlePrevDay} className="p-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded transition" title="Previous Day">
                <ChevronLeft size={18} />
              </button>
              <div className="flex items-center space-x-2 px-3 border-l border-r border-slate-700">
                <Calendar size={14} className="text-yellow-400" />
                <input 
                  type="date" 
                  value={selectedDateStr}
                  onChange={(e) => setSelectedDateStr(e.target.value)}
                  className="bg-transparent text-white text-sm font-bold focus:outline-none cursor-pointer"
                  style={{ colorScheme: 'dark' }}
                />
              </div>
              <button onClick={handleNextDay} className="p-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded transition" title="Next Day">
                <ChevronRight size={18} />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <div className="bg-gradient-to-br from-green-400 to-green-600 p-6 rounded-2xl text-slate-950 shadow-lg shadow-green-500/20 md:col-span-2">
              <div className="flex justify-between items-start">
                 <div>
                   <div className="text-sm font-bold uppercase mb-1 opacity-80">Total Net Profit</div>
                   <div className="text-3xl font-black">{formatCurrency(totalProfit)}</div>
                 </div>
                 <div className="bg-white/20 p-2 rounded-lg">
                    <BarChart3 size={24} className="text-slate-900" />
                 </div>
              </div>
              <div className="mt-4 pt-4 border-t border-slate-900/10 flex justify-between items-center text-sm font-medium">
                 <span>Gross Revenue: <span className="font-bold">{formatCurrency(totalRevenue)}</span></span>
                 <span className="bg-black/10 px-3 py-1 rounded-full">{filteredTrx.length} Trx</span>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-center">
              <div className="text-sm font-semibold text-slate-400 mb-3 flex items-center">
                <Coffee size={14} className="mr-2 text-yellow-400"/> F&B Segmentation
              </div>
              <div className="flex justify-between items-end border-b border-slate-800/50 pb-2 mb-2">
                <span className="text-slate-300 text-xs font-medium">Gross Revenue</span>
                <span className="font-bold text-white">{formatCurrency(fnbRevenue)}</span>
              </div>
              <div className="flex justify-between items-end">
                <span className="text-slate-300 text-xs font-medium">Net Profit</span>
                <span className="font-bold text-green-400">{formatCurrency(fnbProfit)}</span>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-center">
              <div className="text-sm font-semibold text-slate-400 mb-3 flex items-center">
                 <Play size={14} className="mr-2 text-blue-400"/> PS Rentals
              </div>
               <div className="flex justify-between items-end border-b border-slate-800/50 pb-2 mb-2">
                <span className="text-slate-300 text-xs font-medium">Rental Revenue</span>
                <span className="font-bold text-blue-400">{formatCurrency(rentalRevenue)}</span>
              </div>
              <div className="flex justify-between items-end">
                 <span className="text-slate-300 text-xs font-medium text-right w-full text-slate-500">
                   *100% Margin Calculated
                 </span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
              <div className="p-5 border-b border-slate-800 bg-slate-950">
                <h3 className="font-bold text-white text-lg">Per-Unit Revenue</h3>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th className="px-4 py-3 font-medium">Unit</th>
                      <th className="px-4 py-3 font-medium">Rental Income</th>
                      <th className="px-4 py-3 font-medium">F&B Add-ons</th>
                      <th className="px-4 py-3 font-medium text-right text-yellow-400">Total Billed</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/50">
                    {Object.values(unitProfit).sort((a,b) => b.total - a.total).map((u, i) => (
                      <tr key={i} className="hover:bg-slate-800/50">
                        <td className="px-4 py-3 font-semibold text-white">{u.name}</td>
                        <td className="px-4 py-3 text-slate-300">{formatCurrency(u.rental)}</td>
                        <td className="px-4 py-3 text-slate-300">{formatCurrency(u.fnb)}</td>
                        <td className="px-4 py-3 font-bold text-yellow-400 text-right">{formatCurrency(u.total)}</td>
                      </tr>
                    ))}
                    {Object.keys(unitProfit).length === 0 && (
                      <tr><td colSpan="4" className="text-center py-6 text-slate-500">No active rental transactions for this date.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col max-h-[500px]">
               <div className="p-5 border-b border-slate-800 bg-slate-950 flex justify-between items-center z-10 sticky top-0">
                <h3 className="font-bold text-white text-lg">Latest Transactions</h3>
                <div className="text-xs text-slate-400 flex space-x-3">
                  <span><span className="text-purple-400 font-bold">QRIS:</span> {formatCurrency(qrisRevenue)}</span>
                  <span><span className="text-yellow-400 font-bold">CASH:</span> {formatCurrency(cashRevenue)}</span>
                </div>
              </div>
              <div className="overflow-y-auto p-4 space-y-3 flex-1">
                {/* Menghapus limit .slice(0, 10) agar memunculkan seluruh transaksi di hari itu */}
                {filteredTrx.map((trx, i) => {
                  const orderedItems = trx.type === 'walk-in' ? trx.items : trx.fnbOrders;
                  
                  return (
                  <div key={i} className="bg-slate-950 p-4 rounded-lg border border-slate-800 flex flex-col justify-between hover:border-slate-600 transition">
                    <div className="flex justify-between items-start w-full">
                      <div>
                        <div className="font-semibold text-white mb-1">
                          {trx.type === 'walk-in' ? 'Walk-in FnB Sale' : `Session - ${trx.unit_name}`}
                        </div>
                        <div className="text-xs text-slate-400 flex items-center">
                          <Clock size={12} className="mr-1" />
                          {new Date(trx.timestamp).toLocaleTimeString('id-ID')} 
                          <span className="mx-2">•</span> 
                          {trx.paymentMethod === 'QRIS' ? <CreditCard size={12} className="mr-1 text-purple-400"/> : <Banknote size={12} className="mr-1 text-yellow-400"/>}
                          {trx.paymentMethod}
                        </div>
                      </div>
                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <div className="font-bold text-yellow-400">{formatCurrency(trx.grandTotal)}</div>
                          {trx.type === 'walk-in' && <div className="text-[10px] text-green-400">Profit: +{formatCurrency((trx.fnbTotal || 0) - (trx.fnbCostTotal || 0))}</div>}
                        </div>
                        <button 
                          onClick={() => onDeleteTransaction(trx.id)}
                          className="p-2 bg-slate-900/50 hover:bg-red-500/20 text-slate-500 hover:text-red-400 rounded-lg transition border border-slate-800 hover:border-red-500/30"
                          title="Delete Transaction (Restores F&B Stock)"
                        >
                          <Trash2 size={16} />
                        </button>
                      </div>
                    </div>

                    {/* History Bill / Ordered Items Details List */}
                    {orderedItems && orderedItems.length > 0 && (
                      <div className="mt-3 pt-3 border-t border-slate-800/50">
                        <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Order History</div>
                        <div className="bg-slate-900/50 rounded-lg p-2 space-y-1.5 border border-slate-800">
                          {orderedItems.map((order, idx) => (
                            <div key={idx} className="flex justify-between items-center text-xs text-slate-400">
                              <span><span className="text-white font-medium">{order.qty}x</span> {order.item.name}</span>
                              <span className="font-mono">{formatCurrency(order.item.price * order.qty)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Display saved note from Checkout in financial records */}
                    {trx.note && (
                      <div className="mt-3 text-xs bg-red-500/10 border border-red-500/25 text-red-300 px-2.5 py-2 rounded-lg flex items-center">
                        <AlertTriangle size={12} className="mr-1.5 shrink-0 opacity-80" />
                        <span className="truncate"><strong>Checkout Note:</strong> {trx.note}</span>
                      </div>
                    )}
                  </div>
                )})}
                {filteredTrx.length === 0 && (
                  <div className="text-center py-10 text-slate-500">No transactions recorded yet.</div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AddFnbItemModal({ onClose, onAdd }) {
      const [formData, setFormData] = useState({
        name: '',
        sku: '',
        category: 'Food',
        cost: '',
        price: '',
        stock: '',
        alert: '5'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name) return;

        onAdd({
          name: formData.name,
          sku: formData.sku || `SKU${Math.floor(Math.random() * 10000)}`,
          category: formData.category,
          cost: parseInt(formData.cost) || 0,
          price: parseInt(formData.price) || 0,
          stock: parseInt(formData.stock) || 0,
          alert: parseInt(formData.alert) || 5,
        });
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center">
                <Plus size={18} className="mr-2 text-yellow-400" />
                Add F&B Item
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={20} /></button>
            </div>
            
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="text-sm font-medium text-slate-300 block mb-1">Item Name</label>
                <input 
                  type="text" required value={formData.name}
                  onChange={(e) => setFormData({...formData, name: e.target.value})}
                  placeholder="e.g. Potato Chips"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">Category</label>
                  <select 
                    value={formData.category}
                    onChange={(e) => setFormData({...formData, category: e.target.value})}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  >
                    <option value="Food">Food</option>
                    <option value="Drink">Drink</option>
                    <option value="Misc">Misc</option>
                  </select>
                </div>
                <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">SKU</label>
                  <input 
                    type="text" value={formData.sku}
                    onChange={(e) => setFormData({...formData, sku: e.target.value})}
                    placeholder="Optional"
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                 <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">Cost (Modal)</label>
                  <input 
                    type="number" required value={formData.cost}
                    onChange={(e) => setFormData({...formData, cost: e.target.value})}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  />
                </div>
                <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">Selling Price</label>
                  <input 
                    type="number" required value={formData.price}
                    onChange={(e) => setFormData({...formData, price: e.target.value})}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                 <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">Initial Stock</label>
                  <input 
                    type="number" required value={formData.stock}
                    onChange={(e) => setFormData({...formData, stock: e.target.value})}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  />
                </div>
                <div>
                  <label className="text-sm font-medium text-slate-300 block mb-1">Low Alert At</label>
                  <input 
                    type="number" value={formData.alert}
                    onChange={(e) => setFormData({...formData, alert: e.target.value})}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400"
                  />
                </div>
              </div>
              
              <button
                type="submit"
                className="w-full bg-yellow-400 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg hover:bg-yellow-500 transition mt-4"
              >
                Save F&B Item
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- RENDER ---
    const root = createRoot(document.getElementById('root'));
    root.render(<SkyzoneHub />);
  </script>
</body>
</html>
