                    <span>{trx.memberName} ({(MEMBER_TIERS[trx.memberTierAtSale] || MEMBER_TIERS.rookie).name})</span>
                  </div>
                )}
                <div className="border-t border-dashed border-slate-400 my-2"></div>

                <div>
                  {trx.type !== 'walk-in' && (
                    <div className="flex justify-between items-start gap-2 mb-1.5" style={{ lineHeight: '1.5' }}>
                      <span>Waktu Sewa Konsol</span>
                      <span className="whitespace-nowrap">{formatCurrency(trx.rentalTotalBeforeDiscount ?? trx.rentalTotal)}</span>
                    </div>
                  )}
                  {orderedItems && orderedItems.map((order, idx) => (
                    <div key={idx} className="flex justify-between items-start gap-2 mb-1.5" style={{ lineHeight: '1.5' }}>
                      <span style={{ wordBreak: 'break-word' }}>{order.qty}x {order.item.name}</span>
                      <span className="whitespace-nowrap">{formatCurrency(order.item.price * order.qty)}</span>
                    </div>
                  ))}
                  {(!orderedItems || orderedItems.length === 0) && trx.type !== 'walk-in' && (
                    <div className="text-slate-400 italic">Tidak ada pesanan F&amp;B.</div>
                  )}
                </div>

                {trx.memberDiscountAmount > 0 && (
                  <div className="flex justify-between items-start gap-2 mb-1.5" style={{ lineHeight: '1.5' }}>
                    <span>Diskon Member</span>
                    <span className="whitespace-nowrap">-{formatCurrency(trx.memberDiscountAmount)}</span>
                  </div>
                )}
                {trx.pointsDiscount > 0 && (
                  <div className="flex justify-between items-start gap-2 mb-1.5" style={{ lineHeight: '1.5' }}>
                    <span>Poin Dipakai ({trx.pointsRedeemed})</span>
                    <span className="whitespace-nowrap">-{formatCurrency(trx.pointsDiscount)}</span>
                  </div>
                )}

                <div className="border-t border-dashed border-slate-400 my-2"></div>
                <div className="flex justify-between font-bold text-sm">
                  <span>TOTAL</span>
                  <span>{formatCurrency(trx.grandTotal)}</span>
                </div>
                <div className="flex justify-between text-[10px] mt-1">
                  <span>Metode Bayar:</span><span>{trx.paymentMethod}</span>
                </div>

                {trx.note && (
                  <div className="mt-2 text-[10px] italic border-t border-dashed border-slate-400 pt-2">
                    Catatan: {trx.note}
                  </div>
                )}

                {trx.memberName && (
                  <div className="mt-2 text-[10px] border-t border-dashed border-slate-400 pt-2">
                    {trx.promoMultiplier > 1 && (
                      <div className="font-bold">Promo Happy Hour Active: {trx.promoMultiplier}x Point</div>
                    )}
                    <div className="flex justify-between">
                      <span>Poin Didapat:</span>
                      <span>+{trx.pointsEarned || 0}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Sisa Poin:</span>
                      <span>{(trx.memberPointsBalanceAfter ?? 0).toLocaleString('id-ID')}</span>
                    </div>
                  </div>
                )}

                <div className="border-t border-dashed border-slate-400 my-2"></div>
                <div className="text-center text-[10px] mt-3">
                  Terima kasih atas kunjungan Anda!
                </div>
              </div>
            </div>

            <div className="p-5 border-t border-slate-800 bg-slate-950 shrink-0 space-y-2">
              <div className="grid grid-cols-2 gap-3">
                <button
                  onClick={handleDownloadPNG}
                  disabled={exporting}
                  className="flex items-center justify-center py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm transition disabled:opacity-50"
                >
                  <Image size={16} className="mr-2" /> {exporting ? '...' : 'PNG'}
                </button>
                <button
                  onClick={handleDownloadPDF}
                  disabled={exporting}
                  className="flex items-center justify-center py-3 rounded-xl bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold text-sm transition disabled:opacity-50"
                >
                  <FileText size={16} className="mr-2" /> {exporting ? '...' : 'PDF'}
                </button>
              </div>
              <button
                onClick={onClose}
                className="w-full py-2.5 rounded-xl bg-transparent hover:bg-slate-800 text-slate-400 text-sm font-medium transition"

    // ExtendTime Modal for adding hours to prepaid sessions
    function ExtendTimeModal({ unit, tierInfo, onClose, onExtend }) {
      const [hours, setHours] = useState(1);

      const adjustHours = (delta) => {
        setHours(prev => Math.max(0.5, Math.round((prev + delta) * 2) / 2));
      };
      
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center text-lg">
                <Timer size={18} className="mr-2 text-blue-400" />
                Extend Time - {unit.name}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white transition">
                <X size={20} />
              </button>
            </div>
            <div className="p-6 space-y-5">
              <div className="space-y-3">
                <label className="text-sm font-medium text-slate-300 block mb-2">Add Duration</label>

                {/* Quick-select chips - includes a 30-minute option */}
                <div className="flex flex-wrap gap-2">
                  {QUICK_DURATIONS.map(q => (
                    <button
                      key={q}
                      type="button"
                      onClick={() => setHours(q)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${hours === q ? 'bg-blue-500 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                    >
                      {formatDuration(q)}
                    </button>
                  ))}
                </div>

                {/* Fine-tune in 30-minute steps */}
                <div className="flex items-center space-x-3">
                  <button
                    type="button"
                    onClick={() => adjustHours(-0.5)}
                    className="w-11 h-11 shrink-0 flex items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xl font-bold transition"
                  >
                    −
                  </button>
                  <div className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white text-lg text-center font-bold">
                    {formatDuration(hours)}
                  </div>
                  <button
                    type="button"
                    onClick={() => adjustHours(0.5)}
                    className="w-11 h-11 shrink-0 flex items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xl font-bold transition"
                  >
                    +
                  </button>
                </div>

                <p className="text-xs text-slate-400 flex justify-between">
                  <span>Additional billing:</span> 
                  <span className="text-yellow-400 font-bold text-sm">+{formatCurrency(calculateBlockCost(hours, tierInfo))}</span>
                </p>
              </div>
              
              <button 
                onClick={() => onExtend(unit.id, hours)} 
                className="w-full bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-600 transition mt-2 flex items-center justify-center"
              >
                <Timer size={18} className="mr-2" /> Confirm Extension
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Inline Session Note Manager for Active Consoles
    function SessionNoteManager({ unit, onUpdateNote }) {
      const [isEditing, setIsEditing] = useState(false);
      const [tempNote, setTempNote] = useState(unit.activeSession?.note || '');

      const handleSave = () => {
        onUpdateNote(unit.id, tempNote.trim());
        setIsEditing(false);
      };

      if (isEditing) {
        return (
          <div className="flex items-center space-x-1.5 py-1 mb-2">
            <input
              type="text"
              value={tempNote}
              onChange={(e) => setTempNote(e.target.value)}
              placeholder="e.g. Unpaid, needs bill audit"
              className="flex-1 bg-slate-950 text-xs border border-slate-700 rounded-lg px-2.5 py-1.5 text-white focus:outline-none focus:border-yellow-400"
              autoFocus
              onKeyDown={(e) => {
                if (e.key === 'Enter') handleSave();
                if (e.key === 'Escape') setIsEditing(false);
              }}
            />
            <button 
              onClick={handleSave} 
              className="p-1.5 bg-green-500 hover:bg-green-600 rounded-lg text-slate-950 transition-colors"
              title="Save Note"
            >
              <Check size={12} />
            </button>
            <button 
              onClick={() => setIsEditing(false)} 
              className="p-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 transition-colors"
              title="Cancel"
            >
              <X size={12} />
            </button>
          </div>
        );
      }

      const currentNote = unit.activeSession?.note || '';
      // Regex check for payment, billing, or unpaid alert keywords to trigger danger highlight color styling automatically
      const isCritical = /unpaid|debt|pay|paid|billing|bayar|belum|tempo|bon|hutang/i.test(currentNote);

      return (
        <div className="py-1 mb-2 border-t border-slate-800/50 mt-1">
          {currentNote ? (
            <div className={`flex items-center justify-between text-xs p-2 rounded-lg border transition ${
              isCritical 
                ? 'bg-red-500/10 border-red-500/30 text-red-300' 
                : 'bg-slate-950/80 border-slate-800 text-slate-300'
            }`}>
              <span className="truncate flex-1" title={currentNote}>
                <span className="font-semibold text-[10px] uppercase tracking-wider opacity-60 block">Session Note</span>
                {currentNote}
              </span>
              <div className="flex space-x-1 ml-2">
                <button 
                  onClick={() => { setTempNote(currentNote); setIsEditing(true); }}
                  className="p-1 text-slate-400 hover:text-white rounded transition"
                  title="Edit Note"
                >
                  <Edit2 size={11} />
                </button>
                <button 
                  onClick={() => onUpdateNote(unit.id, '')}
                  className="p-1 text-slate-400 hover:text-red-400 rounded transition"
                  title="Delete Note"
                >
                  <Trash2 size={11} />
                </button>
              </div>
            </div>
          ) : (
            <button 
              onClick={() => setIsEditing(true)}
              className="text-[11px] text-slate-500 hover:text-yellow-400 flex items-center transition"
            >
              <Plus size={10} className="mr-1" /> Add session note...
            </button>
          )}
        </div>
      );
    }

    const QUICK_DURATIONS = [0.5, 1, 1.5, 2, 3, 4];

    // Reusable search-and-select for attaching a member to a rental session or walk-in sale.
    function MemberPicker({ members, selectedMemberId, onSelect }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);

      const selectedMember = members.find(m => m.id === selectedMemberId);

      const results = query.trim() === '' ? members.slice(0, 20) : members.filter(m =>
        m.name.toLowerCase().includes(query.toLowerCase()) || m.phone.includes(query)
      );

      if (selectedMember) {
        const tierInfo = MEMBER_TIERS[selectedMember.tier];
        return (
          <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 flex items-center justify-between">
            <div className="flex items-center min-w-0">
              <div className="w-9 h-9 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 shrink-0">
                <UserCircle size={18} className="text-blue-300" />
              </div>
              <div className="min-w-0">
                <div className="text-white font-bold text-sm truncate">{selectedMember.name}</div>
                <div className="text-[11px] text-blue-300 flex items-center">
                  <Award size={11} className="mr-1" /> {tierInfo.name} • {getEffectivePoints(selectedMember, Date.now()).toLocaleString('id-ID')} poin
                </div>
              </div>
            </div>
            <button
              type="button"
              onClick={() => onSelect(null)}
              className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition shrink-0"
              title="Lepas member"
            >
              <X size={16} />
            </button>
          </div>
        );
      }

      return (
        <div className="relative">
          <div className="relative">
            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <Search size={14} className="text-slate-500" />
            </div>
            <input
              type="text"
              value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)}
              placeholder="Cari member: nama / no. HP..."
              className="w-full bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-3 py-2.5 text-white text-sm focus:outline-none focus:border-blue-400 transition"
            />
          </div>
          {open && (
            <div className="absolute z-10 mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-52 overflow-y-auto">
              {results.length === 0 && (
                <div className="p-3 text-xs text-slate-500 text-center">Member tidak ditemukan.</div>
              )}
              {results.map(m => (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => { onSelect(m.id); setOpen(false); setQuery(''); }}
                  className="w-full text-left px-3 py-2.5 hover:bg-slate-700 transition flex items-center justify-between text-sm border-b border-slate-700/50 last:border-0"
                >
                  <div>
                    <div className="text-white font-medium">{m.name}</div>
                    <div className="text-[11px] text-slate-500">{m.phone}</div>
                  </div>
                  <span className="text-[10px] font-bold text-blue-300 bg-blue-500/10 px-2 py-0.5 rounded">{MEMBER_TIERS[m.tier].name}</span>
                </button>
              ))}
              {members.length === 0 && (
                <div className="p-3 text-xs text-slate-500 text-center">Belum ada member terdaftar.</div>
              )}
            </div>
          )}
        </div>
      );
    }

    function StartSessionForm({ unit, onStart, tierInfo, members }) {

      const [hours, setHours] = useState(1);
      const [selectedMemberId, setSelectedMemberId] = useState(null);

      const adjustHours = (delta) => {
        setHours(prev => Math.max(0.5, Math.round((prev + delta) * 2) / 2));
      };
      
      return (
        <div className="p-6 space-y-5">
          <div>
            <label className="text-sm font-medium text-slate-300 block mb-2">Member (Optional)</label>
            <MemberPicker members={members || []} selectedMemberId={selectedMemberId} onSelect={setSelectedMemberId} />
          </div>

          <div>
            <label className="text-sm font-medium text-slate-300 block mb-2">Session Type</label>
            <div className="flex space-x-2">
              <button 
                onClick={() => setType('pay-as-you-go')} 
                className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition ${type === 'pay-as-you-go' ? 'bg-yellow-400 text-slate-900 shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
              >
                Pay As You Go
              </button>
              <button 
                onClick={() => setType('prepaid')} 
                className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition ${type === 'prepaid' ? 'bg-yellow-400 text-slate-900 shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
              >
                Prepaid (Hours)
              </button>
            </div>
          </div>
          
          {type === 'prepaid' && (
            <div className="animate-in space-y-3">
              <label className="text-sm font-medium text-slate-300 block mb-2">Duration</label>

              {/* Quick-select chips - includes a 30-minute option */}
              <div className="flex flex-wrap gap-2">
                {QUICK_DURATIONS.map(q => (
                  <button
                    key={q}
                    type="button"
                    onClick={() => setHours(q)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${hours === q ? 'bg-yellow-400 text-slate-900 shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    {formatDuration(q)}
                  </button>
                ))}
              </div>

              {/* Fine-tune in 30-minute steps */}
              <div className="flex items-center space-x-3">
                <button
                  type="button"
                  onClick={() => adjustHours(-0.5)}
                  className="w-11 h-11 shrink-0 flex items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xl font-bold transition"
                >
                  −
                </button>
                <div className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white text-lg text-center font-bold">
                  {formatDuration(hours)}
                </div>
                <button
                  type="button"
                  onClick={() => adjustHours(0.5)}
                  className="w-11 h-11 shrink-0 flex items-center justify-center rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xl font-bold transition"
                >
                  +
                </button>
              </div>

              <p className="text-xs text-slate-400">Estimated cost: <span className="text-yellow-400 font-bold">{formatCurrency(calculateBlockCost(hours, tierInfo))}</span></p>
            </div>
          )}
          
          <button 
            onClick={() => onStart(unit.id, type, type === 'prepaid' ? hours : 0, selectedMemberId)} 
            className="w-full bg-yellow-400 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg hover:bg-yellow-500 transition mt-2 flex items-center justify-center"
          >
            <Play size={18} className="mr-2 fill-current" /> Start Session Now
          </button>
        </div>
      );
    }

    function AddFnbModal({ isOpen, unit, inventory, isWalkIn, members, onClose, onAdd }) {
      const [cart, setCart] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMemberId, setSelectedMemberId] = useState(null);
      const [redeemInput, setRedeemInput] = useState('0');
      if (!isOpen) return null;

      const addToCart = (item) => {
        const existing = cart.find(c => c.item.id === item.id);
        if (existing) {
          if (existing.qty < item.stock) {
            setCart(cart.map(c => c.item.id === item.id ? { ...c, qty: c.qty + 1 } : c));
          }
        } else {
          if (item.stock > 0) {
            setCart([...cart, { item, qty: 1 }]);
          }
        }
      };

      const removeFromCart = (itemId) => {
        const existing = cart.find(c => c.item.id === itemId);
        if (existing.qty === 1) {
          setCart(cart.filter(c => c.item.id !== itemId));
        } else {
          setCart(cart.map(c => c.item.id === itemId ? { ...c, qty: c.qty - 1 } : c));
        }
      };

      const total = cart.reduce((sum, c) => sum + (c.item.price * c.qty), 0);

      const selectedMember = isWalkIn && selectedMemberId ? (members || []).find(m => m.id === selectedMemberId) : null;
      const pointsToRedeem = Math.max(0, parseInt(redeemInput, 10) || 0);
      const walkInBreakdown = isWalkIn ? computeWalkInBreakdown(total, selectedMember, pointsToRedeem, Date.now()) : null;
      const maxRedeemable = walkInBreakdown ? walkInBreakdown.maxRedeemablePoints : 0;
      const selectedAvailablePoints = walkInBreakdown ? walkInBreakdown.availablePoints : 0;
      
      const filteredInventory = inventory.filter(i => 
        i.stock > 0 && 
        i.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center text-lg">
                <ShoppingCart size={18} className="mr-2 text-yellow-400" />
                Add F&B {unit ? `to ${unit.name}` : '(Walk-in POS)'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white transition"><X size={20} /></button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5 grid grid-cols-1 md:grid-cols-5 gap-6">
              
              {/* Inventory List */}
              <div className="md:col-span-3 flex flex-col h-full">
                <div className="mb-4">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Available Items</h4>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <Search size={16} className="text-slate-500" />
                    </div>
                    <input
                      type="text"
                      placeholder="Search items to add..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 text-sm rounded-lg pl-9 pr-3 py-2 text-white focus:outline-none focus:border-yellow-400 transition"
                    />
                  </div>
                </div>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 overflow-y-auto pr-1 flex-1 content-start">
                  {filteredInventory.map(item => (
                    <div key={item.id} className="flex justify-between items-center p-3 bg-slate-800/40 rounded-xl border border-slate-700/50 hover:border-yellow-400/30 transition group">
                      <div>
                        <div className="font-medium text-white text-sm">{item.name}</div>
                        <div className="text-xs mt-1">
                          <span className="text-yellow-400 font-semibold">{formatCurrency(item.price)}</span>
                          <span className="text-slate-500 mx-1">•</span>
                          <span className="text-slate-400">Stock: {item.stock}</span>
                        </div>
                      </div>
                      <button 
                        onClick={() => addToCart(item)} 
                        className="p-2 bg-slate-700 hover:bg-yellow-400 hover:text-slate-900 text-white rounded-lg transition"
                      >
                        <Plus size={16} />
                      </button>
                    </div>
                  ))}
                  {filteredInventory.length === 0 && (
                     <div className="col-span-2 py-8 text-center text-slate-500 text-sm">
                       {inventory.filter(i => i.stock > 0).length === 0 
                         ? "All F&B items are out of stock." 
                         : "No items match your search."}
                     </div>
                  )}
                </div>
              </div>

              {/* Cart */}
              <div className="md:col-span-2 bg-slate-950 p-5 rounded-2xl border border-slate-800 flex flex-col h-full shadow-inner">
                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">Current Order</h4>
                
                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                  {cart.length === 0 ? <div className="text-slate-600 text-sm text-center py-10 flex flex-col items-center"><ShoppingCart size={32} className="mb-3 opacity-20"/> Cart is empty</div> :
                    cart.map(c => (
                      <div key={c.item.id} className="flex flex-col text-sm bg-slate-900/50 p-2.5 rounded-lg border border-slate-800">
                        <div className="text-white font-medium truncate mb-2">{c.item.name}</div>
                        <div className="flex justify-between items-center">
                          <div className="text-yellow-400 font-bold">{formatCurrency(c.item.price * c.qty)}</div>
                          <div className="flex items-center space-x-2 bg-slate-800 rounded-lg px-1 py-1">
                            <button onClick={() => removeFromCart(c.item.id)} className="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded"><Minus size={14}/></button>
                            <span className="text-white font-bold w-6 text-center">{c.qty}</span>
                            <button onClick={() => addToCart(c.item)} className="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded"><Plus size={14}/></button>
                          </div>
                        </div>
                      </div>
                    ))
                  }
                </div>
                
                <div className="pt-4 mt-4 space-y-3">
                  {/* Member attach + points redeem - only relevant for an instant walk-in sale */}
                  {isWalkIn && (
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Member (Optional)</label>
                      <MemberPicker members={members || []} selectedMemberId={selectedMemberId} onSelect={setSelectedMemberId} />
                      {selectedMember && selectedAvailablePoints > 0 && (
                        <div className="pt-1">
                          <label className="text-[11px] text-slate-400 block mb-1">Gunakan Poin (saldo: {selectedAvailablePoints.toLocaleString('id-ID')} • maks. {MAX_REDEEM_PERCENT}% tagihan)</label>
                          <div className="flex items-center space-x-2">
                            <input
                              type="number"
                              min="0"
                              max={maxRedeemable}
                              value={redeemInput}
                              onChange={(e) => setRedeemInput(e.target.value)}
                              className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-green-400"
                              placeholder="0"
                            />
                            <button
                              type="button"
                              onClick={() => setRedeemInput(String(maxRedeemable))}
                              className="px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold transition shrink-0"
                            >
                              Max ({maxRedeemable})
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-300 font-medium text-sm">Subtotal</span>
                      <span className="text-white font-bold">{formatCurrency(total)}</span>
                    </div>
                    {isWalkIn && walkInBreakdown && walkInBreakdown.pointsDiscount > 0 && (
                      <div className="flex justify-between items-center text-sm">
                        <span className="text-green-400">Poin Dipakai ({walkInBreakdown.actualPointsRedeemed} poin)</span>
                        <span className="text-green-400 font-medium">-{formatCurrency(walkInBreakdown.pointsDiscount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between items-center pt-1.5 mt-1 border-t border-slate-800">
                      <span className="text-slate-300 font-medium">Total Bill</span>
                      <span className="text-xl font-black text-yellow-400">{formatCurrency(isWalkIn && walkInBreakdown ? walkInBreakdown.grandTotal : total)}</span>
                    </div>
                    {isWalkIn && selectedMember && (
                      <div className="text-[11px] text-slate-500 pt-1">Pembelian F&B tidak menghasilkan poin (poin hanya dari sewa unit).</div>
                    )}
                  </div>

                  <button 
                    onClick={() => onAdd(cart, isWalkIn ? selectedMemberId : null, isWalkIn && walkInBreakdown ? walkInBreakdown.actualPointsRedeemed : 0)} 
                    disabled={cart.length === 0} 
                    className="w-full bg-yellow-400 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg hover:bg-yellow-500 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
                  >
                    <Check size={18} className="mr-2"/> Confirm Order
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )
    }

    function CheckoutModal({ unit, tierInfo, now, members, promo, onClose, onConfirm, onRemoveFnbOrder }) {
      const [method, setMethod] = useState('Cash');
      const [redeemInput, setRedeemInput] = useState('0');
      if (!unit || !unit.activeSession) return null;

      const session = unit.activeSession;
      const member = session.memberId ? (members || []).find(m => m.id === session.memberId) : null;
      const memberTierInfo = member ? MEMBER_TIERS[member.tier] : null;

      const pointsToRedeem = Math.max(0, parseInt(redeemInput, 10) || 0);
      const breakdown = computeCheckoutBreakdown(session, tierInfo, member, pointsToRedeem, now, promo);
      const { rentalTotal, fnbTotal, availablePoints, actualPointsRedeemed, pointsDiscount, grandTotal, projectedEarnedPoints, appliedMultiplier } = breakdown;
      const maxRedeemable = breakdown.maxRedeemablePoints;
      const promoActive = appliedMultiplier > 1;

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center text-lg">
                <Square size={18} className="mr-2 text-red-400 fill-current" /> Checkout - {unit.name}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={20} /></button>
            </div>
            
            <div className="p-6 space-y-4">
              {/* Optional Active Session Note Alert inside Checkout */}
              {session.note && (
                <div className="bg-amber-500/10 border border-amber-500/30 text-amber-300 p-3.5 rounded-xl text-xs">
                  <span className="font-bold uppercase text-[10px] block opacity-60 mb-0.5">Active Alert / Note</span>
                  {session.note}
                </div>
              )}

              {/* Member badge, if a member is attached to this session */}
              {member && (
                <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 flex items-center justify-between">
                  <div className="flex items-center">
                    <div className="w-9 h-9 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 shrink-0">
                      <UserCircle size={18} className="text-blue-300" />
                    </div>
                    <div>
                      <div className="text-white font-bold text-sm">{member.name}</div>
                      <div className="text-[11px] text-blue-300 flex items-center">
                        <Award size={11} className="mr-1" /> {memberTierInfo.name} • {availablePoints.toLocaleString('id-ID')} poin
                      </div>
                    </div>
                  </div>
                  <span className="text-[11px] font-bold bg-blue-500/20 text-blue-300 px-2 py-1 rounded-lg">
                    Cashback {memberTierInfo.cashbackPercent}%
                  </span>
                </div>
              )}

              {/* Happy Hour indicator (only matters when a member earns points on this bill) */}
              {member && promoActive && (
                <div className="bg-gradient-to-r from-amber-500/20 to-yellow-400/10 border border-yellow-400/40 rounded-xl p-3 flex items-center text-xs text-yellow-300">
                  <Sparkles size={14} className="mr-2 shrink-0" />
                  <span className="font-bold">Promo Happy Hour Active: {appliedMultiplier}x Point</span>
                </div>
              )}

              {/* F&B Ordered Items List Detail */}
              <div className="space-y-2">
                <span className="font-bold uppercase text-[10px] tracking-wider text-slate-400 block">Ordered Items Detailed list</span>
                <div class="bg-slate-950/80 border border-slate-800 rounded-xl divide-y divide-slate-850/50 max-h-[40vh] min-h-[140px] overflow-y-auto">
                  
                  {/* Base Rental Component display inside the order summary */}
                  <div className="p-3 flex justify-between items-center text-sm text-slate-300">
                    <div>
                      <span className="font-medium text-white">Console Time ({tierInfo.name})</span>
                      <span className="text-[11px] block text-slate-500">
                        {session.type === 'prepaid' ? 'Prepaid Fixed Slot' : 'Pay As You Go'}
                      </span>
                    </div>
                    <div className="text-right">
                      <span className="text-slate-400">{formatCurrency(rentalTotal)}</span>
                    </div>
                  </div>

                  {/* Dynamic orders mapping */}
                  {session.fnbOrders.map((order, index) => (
                    <div key={index} className="p-3 flex justify-between items-center text-sm group">
                      <div>
                        <span className="font-medium text-white">{order.item.name}</span>
                        <span className="text-[11px] block text-slate-500">
                          {formatCurrency(order.item.price)} x {order.qty}
                        </span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="text-slate-400 font-mono">
                          {formatCurrency(order.item.price * order.qty)}
                        </span>
                        <button
                          type="button"
                          onClick={() => onRemoveFnbOrder(index)}
                          title="Batalkan item ini (stok dikembalikan)"
                          className="p-1.5 rounded-lg text-slate-600 hover:text-red-400 hover:bg-red-500/10 transition"
                        >
                          <Trash2 size={14} />
                        </button>
                      </div>
                    </div>
                  ))}

                  {session.fnbOrders.length === 0 && (
                    <div className="p-3 text-center text-xs text-slate-600 italic">No extra food or drinks ordered.</div>
                  )}
                </div>
              </div>

              <div className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                <div className="flex justify-between text-slate-400 text-sm">
                  <span>Console Rental:</span> 
                  <span className="text-white font-medium">{formatCurrency(rentalTotal)}</span>
                </div>
                {session.fnbOrders.length > 0 && (
                  <div className="flex justify-between text-slate-400 text-sm">
                    <span>F&B Total:</span> 
                    <span className="text-white font-medium">{formatCurrency(fnbTotal)}</span>
                  </div>
                )}
                {pointsDiscount > 0 && (
                  <div className="flex justify-between text-green-400 text-sm">
                    <span>Poin Dipakai ({actualPointsRedeemed} poin):</span>
                    <span className="font-medium">-{formatCurrency(pointsDiscount)}</span>
                  </div>
                )}
                <div className="pt-3 mt-1 border-t border-slate-800 flex justify-between items-center text-lg font-black">
                  <span className="text-white">Grand Total:</span>
                  <span className="text-yellow-400 text-2xl">{formatCurrency(grandTotal)}</span>
                </div>
                {member && projectedEarnedPoints > 0 && (
                  <div className="flex justify-between items-center text-[11px] text-slate-500 pt-1">
                    <span className="flex items-center"><Sparkles size={11} className="mr-1 text-yellow-400" /> Poin didapat (dari sewa{promoActive ? `, ${appliedMultiplier}x` : ''}):</span>
                    <span className="text-yellow-400 font-bold">+{projectedEarnedPoints}</span>
                  </div>
                )}
              </div>

              {/* Redeem Points - only shown when a member with a positive balance is attached */}
              {member && availablePoints > 0 && (
                <div>
                  <label className="text-sm font-medium text-slate-300 block mb-2 flex items-center">
                    <Gift size={14} className="mr-1.5 text-green-400" /> Gunakan Poin (saldo: {availablePoints.toLocaleString('id-ID')})
                  </label>
                  <div className="flex items-center space-x-3">
                    <input
                      type="number"
                      min="0"
                      max={maxRedeemable}
                      value={redeemInput}
                      onChange={(e) => setRedeemInput(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-green-400 text-sm"
                      placeholder="0"
                    />
                    <button
                      type="button"
                      onClick={() => setRedeemInput(String(maxRedeemable))}
                      className="px-3 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition shrink-0"
                    >
                      Max ({maxRedeemable})
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-500 mt-1.5">1 poin = Rp{POINT_VALUE_RUPIAH} • tanpa minimum • maks. {MAX_REDEEM_PERCENT}% dari total tagihan ({maxRedeemable} poin)</p>
                </div>
              )}

              <div>
                <label className="text-sm font-medium text-slate-300 block mb-3">Select Payment Method</label>
                <div className="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => setMethod('Cash')} 
                    className={`py-3.5 rounded-xl text-sm font-bold flex items-center justify-center transition border ${method === 'Cash' ? 'bg-yellow-400 text-slate-900 border-yellow-400' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}
                  >
                    <Banknote size={18} className="mr-2"/> Cash
                  </button>
                  <button 
                    onClick={() => setMethod('QRIS')} 
                    className={`py-3.5 rounded-xl text-sm font-bold flex items-center justify-center transition border ${method === 'QRIS' ? 'bg-purple-500 text-white border-purple-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}
                  >
                    <CreditCard size={18} className="mr-2"/> QRIS
                  </button>
                </div>
              </div>

              <button 
                onClick={() => onConfirm(method, actualPointsRedeemed)} 
                className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex justify-center items-center mt-2"
              >
                <Check size={18} className="mr-2" /> Complete Payment
              </button>
            </div>
          </div>
        </div>
      )
    }

    function AddConsoleModal({ tiers, onClose, onAdd }) {
      const [name, setName] = useState('');
      const [tier, setTier] = useState(Object.keys(tiers)[0]);
      
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center text-lg">
                <Plus size={18} className="mr-2 text-yellow-400" /> Add New Console
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={20} /></button>
            </div>
            
            <div className="p-6 space-y-4">
              <div>
                <label className="text-sm font-medium text-slate-300 block mb-2">Display Name</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="e.g. PS5 VIP 03" 
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-yellow-400 transition" 
                  autoFocus
                />
              </div>
              <div>
                <label className="text-sm font-medium text-slate-300 block mb-2">Pricing Tier</label>
                <select 
                  value={tier} 
                  onChange={e => setTier(e.target.value)} 
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-yellow-400 appearance-none"
                >
                  {Object.values(tiers).map(t => (
                    <option key={t.id} value={t.id}>{t.name} ({formatCurrency(t.rate)}/hr)</option>
                  ))}
                </select>
              </div>
              <button 
                onClick={() => { if(name.trim()) onAdd({ name: name.trim(), tier }) }} 
                disabled={!name.trim()}
                className="w-full bg-yellow-400 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg hover:bg-yellow-500 transition mt-6 disabled:opacity-50 disabled:cursor-not-allowed"
              >
                Create Console Unit
              </button>
            </div>
          </div>
        </div>
      )
    }

    // --- SYSTEM SETTINGS VIEW ---
    function SystemSettings({ tiers, onUpdateTier, units, onUpdateUnitName }) {
      const [editingTier, setEditingTier] = useState(null);
      const [editRate, setEditRate] = useState('');
      const [editRate30, setEditRate30] = useState('');

      const [editingUnit, setEditingUnit] = useState(null);
      const [editUnitName, setEditUnitName] = useState('');

      const handleEdit = (tier) => {
        setEditingTier(tier.id);
        // Both fields are independent and fully manual - no auto math between them
        setEditRate(tier.rate);
        setEditRate30(tier.rate30 ?? tier.rate / 2);
      };

      const handleSave = (tierId) => {
        const rate = parseInt(editRate, 10);
        const rate30 = parseInt(editRate30, 10);
        const newRates = {};
        if (!isNaN(rate) && rate >= 0) newRates.rate = rate;
        if (!isNaN(rate30) && rate30 >= 0) newRates.rate30 = rate30;
        if (Object.keys(newRates).length > 0) {
          onUpdateTier(tierId, newRates);
        }
        setEditingTier(null);
      };

      const handleEditUnit = (unit) => {
        setEditingUnit(unit.id);
        setEditUnitName(unit.name);
      };

      const handleSaveUnit = (unitId) => {
        if (editUnitName.trim()) {
          onUpdateUnitName(unitId, editUnitName.trim());
        }
        setEditingUnit(null);
      };

      return (
        <div className="space-y-6 animate-in pb-10">
          <div>
            <h2 className="text-2xl font-bold text-white">System Settings</h2>
            <p className="text-slate-400 text-sm">Configure global application variables and pricing.</p>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg max-w-3xl">
            <div className="p-5 border-b border-slate-800 bg-slate-950 flex justify-between items-center">
              <h3 className="font-bold text-white text-lg flex items-center">
                <Monitor size={18} className="mr-2 text-yellow-400" />
                PlayStation Rates (Tiers)
              </h3>
            </div>
            <div className="p-0">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                  <tr>
                    <th className="px-6 py-4 font-medium">Tier ID</th>
                    <th className="px-6 py-4 font-medium">Display Name</th>
                    <th className="px-6 py-4 font-medium">Rate (per jam &amp; per 30 menit)</th>
                    <th className="px-6 py-4 font-medium text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/50">
                  {Object.values(tiers).map(tier => (
                    <tr key={tier.id} className="hover:bg-slate-800/30 transition">
                      <td className="px-6 py-4 text-slate-400 font-mono text-xs">{tier.id}</td>
                      <td className="px-6 py-4 font-medium text-white">{tier.name}</td>
                      <td className="px-6 py-4">
                        {editingTier === tier.id ? (
                          <div className="space-y-2">
                            <div className="flex items-center max-w-[180px]">
                              <span className="text-slate-400 mr-2 text-xs w-14 shrink-0">/ Jam</span>
                              <span className="text-slate-500 mr-1 text-sm">Rp</span>
                              <input
                                type="number"
                                value={editRate}
                                onChange={(e) => setEditRate(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-600 rounded px-2 py-1 text-white focus:outline-none focus:border-yellow-400 text-sm"
                                autoFocus
                              />
                            </div>
                            <div className="flex items-center max-w-[180px]">
                              <span className="text-slate-400 mr-2 text-xs w-14 shrink-0">/ 30m</span>
                              <span className="text-slate-500 mr-1 text-sm">Rp</span>
                              <input
                                type="number"
                                value={editRate30}
                                onChange={(e) => setEditRate30(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-600 rounded px-2 py-1 text-white focus:outline-none focus:border-yellow-400 text-sm"
                              />
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-0.5">
                            <div>
                              <span className="text-yellow-400 font-bold">{formatCurrency(tier.rate)}</span>
                              <span className="text-slate-500 text-xs ml-1">/ jam</span>
                            </div>
                            <div>
                              <span className="text-yellow-400 font-bold">{formatCurrency(tier.rate30 ?? tier.rate / 2)}</span>
                              <span className="text-slate-500 text-xs ml-1">/ 30 menit</span>
                            </div>
                          </div>
                        )}
                      </td>
                      <td className="px-6 py-4 text-right">
                        {editingTier === tier.id ? (
                          <button 
                            onClick={() => handleSave(tier.id)}
                            className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center transition"
                          >
                            <Save size={14} className="mr-1" /> Save
                          </button>
                        ) : (
                          <button 
                            onClick={() => handleEdit(tier)}
                            className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center transition"
                          >
                            <Edit2 size={14} className="mr-1" /> Edit Rate
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg max-w-3xl">
            <div className="p-5 border-b border-slate-800 bg-slate-950 flex justify-between items-center">
              <h3 className="font-bold text-white text-lg flex items-center">
                <Monitor size={18} className="mr-2 text-blue-400" />
                PlayStation Units Configuration
              </h3>
            </div>
            <div className="p-0 max-h-96 overflow-y-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-900 text-slate-400 border-b border-slate-800 sticky top-0">
                  <tr>
                    <th className="px-6 py-4 font-medium">Unit ID</th>
                    <th className="px-6 py-4 font-medium">Display Name</th>
                    <th className="px-6 py-4 font-medium">Tier</th>
                    <th className="px-6 py-4 font-medium text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/50">
                  {units.map(unit => (
                    <tr key={unit.id} className="hover:bg-slate-800/30 transition">
                      <td className="px-6 py-4 text-slate-400 font-mono text-xs">{unit.id}</td>
                      <td className="px-6 py-4 font-medium text-white">
                        {editingUnit === unit.id ? (
                          <input
                            type="text"
                            value={editUnitName}
                            onChange={(e) => setEditUnitName(e.target.value)}
                            className="w-full max-w-[200px] bg-slate-950 border border-slate-600 rounded px-2 py-1 text-white focus:outline-none focus:border-yellow-400 text-sm"
                            autoFocus
                          />
                        ) : (
                          unit.name
                        )}
                      </td>
                      <td className="px-6 py-4 text-slate-400">
                        <span className="px-2 py-1 bg-slate-950 rounded text-xs">
                          {tiers[unit.tier]?.name || unit.tier}
                        </span>
                      </td>
                      <td className="px-6 py-4 text-right">
                        {editingUnit === unit.id ? (
                          <button 
                            onClick={() => handleSaveUnit(unit.id)}
                            className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center transition"
                          >
                            <Save size={14} className="mr-1" /> Save
                          </button>
                        ) : (
                          <button 
                            onClick={() => handleEditUnit(unit)}
                            className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center transition"
                          >
                            <Edit2 size={14} className="mr-1" /> Rename
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- PROMO / HAPPY HOUR CONTROL (cashier dashboard) ---
    function PromoControl({ promo, onToggle, onSetMultiplier }) {
      const presets = [1.5, 2, 3];
      return (
        <div className={`rounded-2xl border p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 transition ${promo.active ? 'bg-gradient-to-r from-amber-500/20 via-yellow-400/10 to-transparent border-yellow-400/50 shadow-lg shadow-yellow-400/10' : 'bg-slate-900 border-slate-800'}`}>
          <div className="flex items-center">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center mr-3 shrink-0 ${promo.active ? 'bg-yellow-400 text-slate-900' : 'bg-slate-800 text-slate-500'}`}>
              <Sparkles size={20} />
            </div>
            <div>
              <div className="font-bold text-white text-sm flex items-center">
                Happy Hour / Point Multiplier
                <span className={`ml-2 text-[10px] font-black px-2 py-0.5 rounded-full ${promo.active ? 'bg-yellow-400 text-slate-900 animate-pulse' : 'bg-slate-800 text-slate-500'}`}>
                  {promo.active ? `AKTIF • ${promo.multiplier}x POINT` : 'OFF'}
                </span>
              </div>
              <div className="text-[11px] text-slate-400">
                {promo.active ? 'Poin sewa member dikali multiplier saat checkout. Muncul juga di struk member.' : 'Nyalakan agar poin sewa member dikali multiplier.'}
              </div>
            </div>
          </div>

          <div className="flex items-center flex-wrap gap-3">
            <div className="flex items-center space-x-1.5">
              {presets.map(p => (
                <button
                  key={p}
                  type="button"
                  onClick={() => onSetMultiplier(p)}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${promo.multiplier === p ? 'bg-yellow-400 text-slate-900' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                >
                  {p}x
                </button>
              ))}
              <div className="flex items-center bg-slate-950 border border-slate-700 rounded-lg px-2">
                <input
                  type="number"
                  min="1"
                  max="10"
                  step="0.5"
                  value={promo.multiplier}
                  onChange={(e) => onSetMultiplier(e.target.value)}
                  className="w-14 bg-transparent text-white text-sm py-1.5 focus:outline-none text-center"
                  title="Multiplier kustom (1 - 10)"
                />
                <span className="text-slate-500 text-xs">x</span>
              </div>
            </div>

            <button
              type="button"
              onClick={onToggle}
              role="switch"
              aria-checked={promo.active}
              className={`relative w-14 h-7 rounded-full transition shrink-0 ${promo.active ? 'bg-yellow-400' : 'bg-slate-700'}`}
              title={promo.active ? 'Matikan Happy Hour' : 'Nyalakan Happy Hour'}
            >
              <span className={`absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow transition-transform ${promo.active ? 'translate-x-7' : ''}`}></span>
            </button>
          </div>
        </div>
      );
    }

    // --- MEMBERSHIP DIRECTORY VIEW ---
    function MembersView({ members, transactions, searchTerm, onSearchChange, onAddMember, onDeleteMember, onViewLog, onAddPoints }) {
      const nowTs = Date.now();
      const filteredMembers = members.filter(m =>
        m.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        m.phone.includes(searchTerm)
      );

      const tierBadgeClasses = {
        rookie: 'bg-slate-700 text-slate-300',
        pro: 'bg-blue-500/20 text-blue-300',
        legend: 'bg-yellow-400/20 text-yellow-300',
      };

      const nextTierHint = (spend) => {
        const sorted = Object.values(MEMBER_TIERS).sort((a, b) => a.minSpend - b.minSpend);
        const next = sorted.find(t => t.minSpend > spend);
