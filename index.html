<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyzone Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import Map to resolve Babel's auto-generated JSX runtime imports -->
  <script type="importmap">
    {
      "imports": {
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime"
      }
    }
  </script>
  
  <!-- Babel Standalone for compiling JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Libraries for exporting receipts as PNG / PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Custom Scrollbar for better UI */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    
    /* Animation Utilities */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#0B1120] text-slate-200 font-sans selection:bg-yellow-400/30">
  <div id="root"></div>

  <!-- Main React Application -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Monitor, Coffee, BarChart3, Settings, Play, Square, ShoppingCart, 
      Plus, Minus, AlertTriangle, Clock, LogOut, UserCircle, CreditCard, 
      Banknote, Check, X, Edit2, Save, Zap, Ban, Trash2, Timer,
      ChevronLeft, ChevronRight, Calendar, Search, Printer, Download, Image, FileText,
      Users, Star, Award, Gift, Phone, Sparkles
    } from 'https://esm.sh/lucide-react@0.292.0';

    // --- INITIAL DATA SEEDING ---
    // Each tier now carries two INDEPENDENT, manually-set rates:
    // `rate`   = price for a full hour
    // `rate30` = price for a 30-minute block
    // They don't have to be exactly rate/2 - e.g. a full-hour booking can be
    // priced at a discount compared to 2x the half-hour price.
    const INITIAL_TIERS = {
      ps3_reg: { id: 'ps3_reg', name: 'PS3 Regular', rate: 8000, rate30: 4000 },
      ps4_reg: { id: 'ps4_reg', name: 'PS4 Regular', rate: 10000, rate30: 5000 },
      ps4_semi: { id: 'ps4_semi', name: 'PS4 Semi-VIP', rate: 20000, rate30: 10000 },
      ps4_vip: { id: 'ps4_vip', name: 'PS4 VIP', rate: 30000, rate30: 15000 },
      ps5_vip: { id: 'ps5_vip', name: 'PS5 VIP', rate: 36000, rate30: 18000 },
    };

    const INITIAL_UNITS = [
      ...Array(5).fill(0).map((_, i) => ({ id: `ps3_r_${i+1}`, name: `PS3 Reg 0${i+1}`, tier: 'ps3_reg', status: 'idle', activeSession: null })),
      ...Array(3).fill(0).map((_, i) => ({ id: `ps4_r_${i+1}`, name: `PS4 Reg 0${i+1}`, tier: 'ps4_reg', status: 'idle', activeSession: null })),
      ...Array(2).fill(0).map((_, i) => ({ id: `ps4_sv_${i+1}`, name: `PS4 Semi-VIP 0${i+1}`, tier: 'ps4_semi', status: 'idle', activeSession: null })),
      { id: 'ps4_v_1', name: 'PS4 VIP 01', tier: 'ps4_vip', status: 'idle', activeSession: null },
      ...Array(2).fill(0).map((_, i) => ({ id: `ps5_v_${i+1}`, name: `PS5 VIP 0${i+1}`, tier: 'ps5_vip', status: 'idle', activeSession: null })),
    ];

    const INITIAL_INVENTORY = [
      { id: 'fnb_1', name: 'Indomie Goreng Telur', sku: 'FOOD01', category: 'Food', cost: 4000, price: 10000, stock: 25, alert: 5 },
      { id: 'fnb_2', name: 'Coca Cola 330ml', sku: 'BEV01', category: 'Drink', cost: 4500, price: 8000, stock: 4, alert: 5 },
      { id: 'fnb_3', name: 'French Fries', sku: 'FOOD02', category: 'Food', cost: 6000, price: 15000, stock: 15, alert: 5 },
      { id: 'fnb_4', name: 'Iced Tea', sku: 'BEV02', category: 'Drink', cost: 2000, price: 5000, stock: 50, alert: 10 },
    ];

    // --- MEMBERSHIP PROGRAM CONFIG (revision v2) ---
    // Tier is decided by the member's total spending in the last 3 months (TIER_WINDOW_DAYS).
    const MEMBER_TIERS = {
      rookie: { id: 'rookie', name: 'Rookie', minSpend: 0, cashbackPercent: 5 },
      pro: { id: 'pro', name: 'Pro Gamer', minSpend: 500000, cashbackPercent: 8 },
      legend: { id: 'legend', name: 'Legend', minSpend: 1500000, cashbackPercent: 10 },
    };
    const POINT_VALUE_RUPIAH = 100;      // 1 point = Rp100 (earning AND redeeming)
    const WELCOME_BONUS_POINTS = 15;     // free points on registration
    const POINT_EXPIRY_DAYS = 60;        // balance resets to 0 after 60 days without any transaction
    const MAX_REDEEM_PERCENT = 50;       // points may cover at most 50% of one bill
    const TIER_WINDOW_DAYS = 90;         // "3 bulan terakhir"
    const DAY_MS = 24 * 60 * 60 * 1000;
    const DEFAULT_PROMO = { active: false, multiplier: 2 };

    // Highest tier whose spending threshold is met.
    const computeMemberTier = (spend) => {
      const sorted = Object.values(MEMBER_TIERS).sort((a, b) => b.minSpend - a.minSpend);
      return sorted.find(t => spend >= t.minSpend) || MEMBER_TIERS.rookie;
    };

    // Sum of everything this member paid (all transactions) within the last 90 days.
    const getMemberSpend3Months = (memberId, transactions, nowTs) => {
      const since = nowTs - TIER_WINDOW_DAYS * DAY_MS;
      return transactions
        .filter(t => t.memberId === memberId && t.timestamp >= since)
        .reduce((sum, t) => sum + (t.grandTotal || 0), 0);
    };

    // Points expire when there has been no transaction for 60 days in a row.
    const getLastActivity = (member) => member.lastTransactionAt || member.joinedAt || 0;
    const isPointsExpired = (member, nowTs) => nowTs - getLastActivity(member) > POINT_EXPIRY_DAYS * DAY_MS;
    const getPointsExpiryDate = (member) => new Date(getLastActivity(member) + POINT_EXPIRY_DAYS * DAY_MS);
    const getEffectivePoints = (member, nowTs) => (member && !isPointsExpired(member, nowTs)) ? (member.points || 0) : 0;

    // points = (rentalRupiah / 100) x cashback% x multiplier   (rental only - F&B never earns points)
    const calculateEarnedPoints = (rentalAmount, tierId, multiplier = 1) => {
      const tier = MEMBER_TIERS[tierId] || MEMBER_TIERS.rookie;
      if (!rentalAmount || rentalAmount <= 0) return 0;
      const m = multiplier > 0 ? multiplier : 1;
      return Math.floor((rentalAmount * tier.cashbackPercent * m) / (POINT_VALUE_RUPIAH * 100) + 1e-9);
    };

    // Max points usable on a bill: limited by balance AND by 50% of the bill.
    const getMaxRedeemablePoints = (billTotal, availablePoints) => {
      const cap = Math.floor((billTotal * MAX_REDEEM_PERCENT / 100) / POINT_VALUE_RUPIAH);
      return Math.max(0, Math.min(availablePoints, cap));
    };

    // --- UTILITY FUNCTIONS ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
    };

    const formatDuration = (hours) => {
      const totalMinutes = Math.round(hours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h > 0 && m > 0) return `${h}j ${m}m`;
      if (h > 0) return `${h}j`;
      return `${m}m`;
    };

    // Bills a duration using independently-set per-hour and per-30-minute rates.
    // Any started 30-minute block is billed (rounded up), e.g. 1h15m = 1 full hour (rate) + 1 half-hour block (rate30).
    // Used for PREPAID sessions and EXTEND TIME, which are always selected in clean 30-minute increments.
    const calculateBlockCost = (hours, tier) => {
      if (!tier || hours <= 0) return 0;
      const halfHourBlocks = Math.ceil(hours * 2 - 1e-9);
      const fullHours = Math.floor(halfHourBlocks / 2);
      const hasHalfHour = halfHourBlocks % 2 === 1;
      return fullHours * tier.rate + (hasHalfHour ? (tier.rate30 ?? tier.rate / 2) : 0);
    };

    // Bills PAY-AS-YOU-GO sessions continuously/proportionally off the hourly rate,
    // so the bill grows smoothly with elapsed time instead of jumping in 30-minute steps.
    const calculateContinuousCost = (hours, tier) => {
      if (!tier || hours <= 0) return 0;
      return Math.ceil(hours * tier.rate);
    };

    const formatTime = (ms) => {
      const totalSeconds = Math.floor(Math.max(0, ms) / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };

    // Shared pure calculation used by BOTH the live Checkout preview and the final handleCheckout,
    // so the number the cashier sees is guaranteed to match what actually gets charged/saved.
    const computeCheckoutBreakdown = (session, tier, member, pointsToRedeemInput, nowTs, promo) => {
      let rentalTotal = 0;
      let hoursPlayed = 0;
      if (session.type === 'prepaid') {
        rentalTotal = session.prePaidAmount;
        hoursPlayed = Math.max(0, (session.endTime - session.startTime)) / (1000 * 3600);
      } else {
        hoursPlayed = Math.max(0, nowTs - session.startTime) / (1000 * 3600);
        rentalTotal = calculateContinuousCost(hoursPlayed, tier);
      }

      const fnbTotal = session.fnbOrders.reduce((sum, order) => sum + (order.item.price * order.qty), 0);
      const fnbCostTotal = session.fnbOrders.reduce((sum, order) => sum + (order.item.cost * order.qty), 0);
      const subtotal = rentalTotal + fnbTotal;

      // Redemption: no minimum, capped at 50% of the whole bill and at the (non-expired) balance.
      const availablePoints = getEffectivePoints(member, nowTs);
      const maxRedeemablePoints = member ? getMaxRedeemablePoints(subtotal, availablePoints) : 0;
      const actualPointsRedeemed = member ? Math.max(0, Math.min(pointsToRedeemInput || 0, maxRedeemablePoints)) : 0;
      const pointsDiscount = actualPointsRedeemed * POINT_VALUE_RUPIAH;
      const grandTotal = Math.max(0, subtotal - pointsDiscount);

      // Earning: only on the rupiah actually paid for the rental.
      // The points discount is spread proportionally over rental and F&B.
      const rentalPaid = subtotal > 0 ? Math.max(0, rentalTotal - pointsDiscount * (rentalTotal / subtotal)) : 0;
      const appliedMultiplier = (promo && promo.active && promo.multiplier > 0) ? promo.multiplier : 1;
      const projectedEarnedPoints = member ? calculateEarnedPoints(rentalPaid, member.tier, appliedMultiplier) : 0;

      return {
        rentalTotalBeforeDiscount: rentalTotal, memberDiscountAmount: 0, rentalTotal,
        fnbTotal, fnbCostTotal, subtotal,
        availablePoints, maxRedeemablePoints, actualPointsRedeemed, pointsDiscount, grandTotal,
        rentalPaid, appliedMultiplier,
        hoursPlayed, projectedEarnedPoints,
      };
    };

    // Instant walk-in F&B sale: points can be redeemed (50% cap) but F&B never earns points.
    const computeWalkInBreakdown = (fnbTotal, member, pointsToRedeemInput, nowTs) => {
      const availablePoints = getEffectivePoints(member, nowTs);
      const maxRedeemablePoints = member ? getMaxRedeemablePoints(fnbTotal, availablePoints) : 0;
      const actualPointsRedeemed = member ? Math.max(0, Math.min(pointsToRedeemInput || 0, maxRedeemablePoints)) : 0;
      const pointsDiscount = actualPointsRedeemed * POINT_VALUE_RUPIAH;
      const grandTotal = Math.max(0, fnbTotal - pointsDiscount);
      return { availablePoints, maxRedeemablePoints, actualPointsRedeemed, pointsDiscount, grandTotal, projectedEarnedPoints: 0 };
    };

    // --- MAIN APPLICATION COMPONENT ---
    function SkyzoneHub() {
      // --- STATE MANAGEMENT ---
      const [role, setRole] = useState('admin'); // 'admin' | 'staff'
      const [activeTab, setActiveTab] = useState('monitoring');
      const [now, setNow] = useState(Date.now());
      
      const [tiers, setTiers] = useState(() => {
        const saved = localStorage.getItem('skyzone_tiers');
        return saved ? JSON.parse(saved) : INITIAL_TIERS;
      });

      const [units, setUnits] = useState(() => {
        const saved = localStorage.getItem('skyzone_units');
        return saved ? JSON.parse(saved) : INITIAL_UNITS;
      });
      
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('skyzone_inventory');
        return saved ? JSON.parse(saved) : INITIAL_INVENTORY;
      });
      
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('skyzone_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      const [members, setMembers] = useState(() => {
        const saved = localStorage.getItem('skyzone_members');
        return saved ? JSON.parse(saved) : [];
      });

      // Point ledger: every earn / redeem / welcome bonus / expiry is recorded here.
      const [pointLogs, setPointLogs] = useState(() => {
        const saved = localStorage.getItem('skyzone_point_logs');
        return saved ? JSON.parse(saved) : [];
      });

      // Audit trail: every cancelled session is recorded here (cannot be edited or deleted from the UI).
      const [cancelLogs, setCancelLogs] = useState(() => {
        const saved = localStorage.getItem('skyzone_cancel_logs');
        return saved ? JSON.parse(saved) : [];
      });

      // Transaction waiting for admin PIN before it may be deleted.
      const [deleteTrxPending, setDeleteTrxPending] = useState(null);

      // Cashier-controlled Happy Hour / point multiplier.
      const [promo, setPromo] = useState(() => {
        const saved = localStorage.getItem('skyzone_promo');
        return saved ? JSON.parse(saved) : DEFAULT_PROMO;
      });

      // Modals State
      const [sessionModalUnit, setSessionModalUnit] = useState(null);
      const [extendModalUnit, setExtendModalUnit] = useState(null);
      const [fnbModalUnit, setFnbModalUnit] = useState(null);
      const [checkoutModalUnit, setCheckoutModalUnit] = useState(null);
      const [receiptTrx, setReceiptTrx] = useState(null);
      const [walkInModal, setWalkInModal] = useState(false);
      const [addConsoleModal, setAddConsoleModal] = useState(false);
      const [addFnbModal, setAddFnbModal] = useState(false);
      const [deleteFnbConfirm, setDeleteFnbConfirm] = useState(null);
      const [pinModalOpen, setPinModalOpen] = useState(false);

      const ADMIN_PIN = '2067';

      // Search State for F&B Tab
      const [fnbSearchTerm, setFnbSearchTerm] = useState('');

      // Membership Program State
      const [addMemberModal, setAddMemberModal] = useState(false);
      const [memberSearchTerm, setMemberSearchTerm] = useState('');
      const [deleteMemberConfirm, setDeleteMemberConfirm] = useState(null);
      const [pointLogMember, setPointLogMember] = useState(null);
      const [addPointsMember, setAddPointsMember] = useState(null);        // member whose "add points" form is open
      const [manualPointPending, setManualPointPending] = useState(null);  // submitted form waiting for admin PIN

      // --- EFFECTS ---
      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Local Storage Sync
      useEffect(() => {
        localStorage.setItem('skyzone_tiers', JSON.stringify(tiers));
        localStorage.setItem('skyzone_units', JSON.stringify(units));
        localStorage.setItem('skyzone_inventory', JSON.stringify(inventory));
        localStorage.setItem('skyzone_transactions', JSON.stringify(transactions));
        localStorage.setItem('skyzone_members', JSON.stringify(members));
        localStorage.setItem('skyzone_point_logs', JSON.stringify(pointLogs));
        localStorage.setItem('skyzone_promo', JSON.stringify(promo));
        localStorage.setItem('skyzone_cancel_logs', JSON.stringify(cancelLogs));
      }, [tiers, units, inventory, transactions, members, pointLogs, promo, cancelLogs]);

      // Keeps member tiers and point expiry up to date automatically:
      // re-evaluated whenever transactions/members change and at least once an hour.
      const refreshHourBucket = Math.floor(now / 3600000);
      useEffect(() => {
        const ts = Date.now();
        const newLogs = [];
        let changed = false;
        const next = members.map(m => {
          let updated = m;
          const tierId = computeMemberTier(getMemberSpend3Months(m.id, transactions, ts)).id;
          if (tierId !== m.tier) updated = { ...updated, tier: tierId };
          if ((m.points || 0) > 0 && isPointsExpired(m, ts)) {
            newLogs.push({
              id: `plog_${ts}_${m.id}`, memberId: m.id, type: 'expire', points: -(m.points || 0),
              balanceAfter: 0, trxId: null, note: `Poin hangus (tidak ada transaksi ${POINT_EXPIRY_DAYS} hari)`, timestamp: ts,
            });
            updated = { ...updated, points: 0 };
          }
          if (updated !== m) changed = true;
          return updated;
        });
        if (changed) setMembers(next);
        if (newLogs.length > 0) setPointLogs(prev => [...newLogs, ...prev]);
      }, [transactions, members, refreshHourBucket]);

      // --- ACTIONS ---
      const handleStartSession = (unitId, type, durationHours = 0, memberId = null) => {
        const unit = units.find(u => u.id === unitId);
        const tier = tiers[unit.tier];
        const startTime = Date.now();
        let endTime = null;
        let prePaidAmount = 0;

        if (type === 'prepaid') {
          endTime = startTime + (durationHours * 3600 * 1000);
          prePaidAmount = calculateBlockCost(durationHours, tier);
        }

        const session = {
          id: `sess_${Date.now()}`,
          type, 
          startTime,
          endTime,
          prePaidAmount,
          fnbOrders: [],
          note: '', // Initial empty note
          memberId: memberId || null,
        };

        setUnits(units.map(u => u.id === unitId ? { ...u, status: 'active', activeSession: session } : u));
        setSessionModalUnit(null);
      };

      const handleExtendTime = (unitId, additionalHours) => {
        setUnits(prevUnits => prevUnits.map(u => {
          if (u.id === unitId && u.activeSession && u.activeSession.type === 'prepaid') {
            const tier = tiers[u.tier];
            return {
              ...u,
              activeSession: {
                ...u.activeSession,
                // Add extended time to the current end time
                endTime: u.activeSession.endTime + (additionalHours * 3600 * 1000),
                // Add extended cost to the prepaid amount
                prePaidAmount: u.activeSession.prePaidAmount + calculateBlockCost(additionalHours, tier)
              }
            };
          }
          return u;
        }));
        setExtendModalUnit(null);
      };

      const handleUpdateSessionNote = (unitId, noteText) => {
        setUnits(prevUnits => prevUnits.map(u => {
          if (u.id === unitId && u.activeSession) {
            return {
              ...u,
              activeSession: {
                ...u.activeSession,
                note: noteText
              }
            };
          }
          return u;
        }));
      };

      const handleAddFnB = (unitId, items, memberId = null, pointsToRedeem = 0) => {
        if (items.length === 0) return;
        const updatedInventory = [...inventory];

        items.forEach(order => {
          const invItem = updatedInventory.find(i => i.id === order.item.id);
          if (invItem && invItem.stock >= order.qty) invItem.stock -= order.qty;
        });

        setInventory(updatedInventory);

        if (unitId === 'walk-in') {
          const fnbTotal = items.reduce((sum, order) => sum + (order.item.price * order.qty), 0);
          const fnbCostTotal = items.reduce((sum, order) => sum + (order.item.cost * order.qty), 0);

          const member = memberId ? members.find(m => m.id === memberId) : null;
          const walkInBreakdown = computeWalkInBreakdown(fnbTotal, member, pointsToRedeem, Date.now());

          const newTransaction = {
            id: `trx_${Date.now()}`,
            type: 'walk-in',
            fnbTotal,
            fnbCostTotal,
            rentalTotal: 0,
            grandTotal: walkInBreakdown.grandTotal,
            paymentMethod: 'Cash', 
            timestamp: Date.now(),
            items: items,
            note: '',
            memberId: member ? member.id : null,
            memberName: member ? member.name : null,
            memberTierAtSale: member ? member.tier : null,
            pointsRedeemed: walkInBreakdown.actualPointsRedeemed,
            pointsDiscount: walkInBreakdown.pointsDiscount,
            pointsEarned: walkInBreakdown.projectedEarnedPoints,
            memberPointsBalanceAfter: member ? Math.max(0, walkInBreakdown.availablePoints - walkInBreakdown.actualPointsRedeemed + walkInBreakdown.projectedEarnedPoints) : null,
            promoMultiplier: 1,
          };
          setTransactions([newTransaction, ...transactions]);
          setWalkInModal(false);

          if (member) {
            handleMemberTransactionUpdate(member.id, {
              hoursPlayed: 0,
              earnedPoints: walkInBreakdown.projectedEarnedPoints,
              pointsRedeemed: walkInBreakdown.actualPointsRedeemed,
              trx: newTransaction,
            });
          }
        } else {
          setUnits(units.map(u => {
            if (u.id === unitId && u.activeSession) {
              return {
                ...u,
                activeSession: { ...u.activeSession, fnbOrders: [...u.activeSession.fnbOrders, ...items] }
              };
            }
            return u;
          }));
          setFnbModalUnit(null);
        }
      };

      const handleRemoveFnbOrder = (unitId, orderIndex) => {
        const unit = units.find(u => u.id === unitId);
        if (!unit || !unit.activeSession) return;
        const orderToRemove = unit.activeSession.fnbOrders[orderIndex];
        if (!orderToRemove) return;

        // Restore the stock that was deducted when this item was ordered
        setInventory(prevInv => prevInv.map(i =>
          i.id === orderToRemove.item.id ? { ...i, stock: i.stock + orderToRemove.qty } : i
        ));

        // Remove the order line from the active session
        setUnits(prevUnits => prevUnits.map(u => {
          if (u.id === unitId && u.activeSession) {
            return {
              ...u,
              activeSession: {
                ...u.activeSession,
                fnbOrders: u.activeSession.fnbOrders.filter((_, idx) => idx !== orderIndex)
              }
            };
          }
          return u;
        }));
      };

      const handleQuickSellFnB = (item) => {
        if (item.stock < 1) return;
        
        // Deduct stock
        setInventory(inventory.map(i => i.id === item.id ? { ...i, stock: i.stock - 1 } : i));

        // Record instantaneous transaction
        const newTransaction = {
          id: `trx_${Date.now()}`,
          type: 'walk-in',
          fnbTotal: item.price,
          fnbCostTotal: item.cost,
          rentalTotal: 0,
          grandTotal: item.price,
          paymentMethod: 'Cash',
          timestamp: Date.now(),
          items: [{ item, qty: 1 }],
          note: ''
        };
        setTransactions([newTransaction, ...transactions]);
      };

      const handleAdjustStock = (itemId, change) => {
        setInventory(prev => prev.map(item => {
          if (item.id === itemId) {
            const newStock = Math.max(0, item.stock + change);
            return { ...item, stock: newStock };
          }
          return item;
        }));
      };

      const handleDeleteFnbItem = (itemId) => {
        setInventory(prev => prev.filter(item => item.id !== itemId));
        setDeleteFnbConfirm(null);
      };

      const handleCheckout = (unitId, paymentMethod, pointsToRedeem = 0) => {
        const unit = units.find(u => u.id === unitId);
        if (!unit || !unit.activeSession) return;

        const session = unit.activeSession;
        const tier = tiers[unit.tier];
        const member = session.memberId ? members.find(m => m.id === session.memberId) : null;

        const breakdown = computeCheckoutBreakdown(session, tier, member, pointsToRedeem, now, promo);

        const newTransaction = {
          id: `trx_${Date.now()}`,
          session_id: session.id,
          unit_id: unit.id,
          unit_name: unit.name,
          type: 'rental',
          rentalTotal: breakdown.rentalTotal,
          rentalTotalBeforeDiscount: breakdown.rentalTotalBeforeDiscount,
          fnbTotal: breakdown.fnbTotal,
          fnbCostTotal: breakdown.fnbCostTotal,
          grandTotal: breakdown.grandTotal,
          paymentMethod,
          timestamp: Date.now(),
          fnbOrders: session.fnbOrders,
          note: session.note || '', // Persist note to financial transaction log
          memberId: member ? member.id : null,
          memberName: member ? member.name : null,
          memberTierAtSale: member ? member.tier : null,
          memberDiscountAmount: breakdown.memberDiscountAmount,
          pointsRedeemed: breakdown.actualPointsRedeemed,
          pointsDiscount: breakdown.pointsDiscount,
          pointsEarned: breakdown.projectedEarnedPoints,
          memberPointsBalanceAfter: member ? Math.max(0, breakdown.availablePoints - breakdown.actualPointsRedeemed + breakdown.projectedEarnedPoints) : null,
          promoMultiplier: member ? breakdown.appliedMultiplier : 1,
        };

        setTransactions([newTransaction, ...transactions]);
        setUnits(units.map(u => u.id === unitId ? { ...u, status: 'idle', activeSession: null } : u));
        setCheckoutModalUnit(null);
        setReceiptTrx(newTransaction);

        if (member) {
          handleMemberTransactionUpdate(member.id, {
            hoursPlayed: breakdown.hoursPlayed,
            earnedPoints: breakdown.projectedEarnedPoints,
            pointsRedeemed: breakdown.actualPointsRedeemed,
            trx: newTransaction,
            multiplier: breakdown.appliedMultiplier,
          });
        }
      };

      const handleAddConsole = (newUnit) => {
        setUnits([...units, { ...newUnit, id: `unit_${Date.now()}`, status: 'idle', activeSession: null }]);
        setAddConsoleModal(false);
      };

      const handleUpdateTierRate = (tierId, newRates) => {
        setTiers({
          ...tiers,
          [tierId]: { ...tiers[tierId], ...newRates }
        });
      };

      // --- MEMBERSHIP PROGRAM ACTIONS ---
      const handleAddMember = (name, phone) => {
        const ts = Date.now();
        const memberId = `mem_${ts}`;
        const newMember = {
          id: memberId,
          name: name.trim(),
          phone: phone.trim(),
          tier: 'rookie',
          points: WELCOME_BONUS_POINTS,
          lifetimeHours: 0,
          joinedAt: ts,
          lastTransactionAt: ts,
        };
        setMembers(prev => [newMember, ...prev]);
        setPointLogs(prev => [{
          id: `plog_${ts}`, memberId, type: 'welcome', points: WELCOME_BONUS_POINTS,
          balanceAfter: WELCOME_BONUS_POINTS, trxId: null, note: 'Welcome bonus registrasi', timestamp: ts,
        }, ...prev]);
        setAddMemberModal(false);
      };

      const handleDeleteMember = (memberId) => {
        setMembers(prev => prev.filter(m => m.id !== memberId));
        setPointLogs(prev => prev.filter(l => l.memberId !== memberId));
        setDeleteMemberConfirm(null);
      };

      // Applies a paid transaction to a member:
      // (1) expire stale points, (2) deduct redeemed points, (3) add earned points (x promo multiplier already applied),
      // (4) refresh last-activity date, (5) re-check tier using spending of the last 90 days incl. this transaction.
      // Balance can never go negative. Every movement is written to the point log.
      const handleMemberTransactionUpdate = (memberId, { hoursPlayed = 0, earnedPoints = 0, pointsRedeemed = 0, trx, multiplier = 1 }) => {
        const m = members.find(x => x.id === memberId);
        if (!m) return;
        const ts = Date.now();
        const logs = [];
        let balance = m.points || 0;

        if (balance > 0 && isPointsExpired(m, ts)) {
          logs.push({ id: `plog_${ts}_exp`, memberId, type: 'expire', points: -balance, balanceAfter: 0, trxId: null,
            note: `Poin hangus (tidak ada transaksi ${POINT_EXPIRY_DAYS} hari)`, timestamp: ts });
          balance = 0;
        }
        if (pointsRedeemed > 0) {
          balance = Math.max(0, balance - pointsRedeemed);
          logs.push({ id: `plog_${ts}_red`, memberId, type: 'redeem', points: -pointsRedeemed, balanceAfter: balance,
            trxId: trx ? trx.id : null, note: `Tukar poin = potongan ${formatCurrency(pointsRedeemed * POINT_VALUE_RUPIAH)}`, timestamp: ts });
        }
        if (earnedPoints > 0) {
          balance += earnedPoints;
          logs.push({ id: `plog_${ts}_earn`, memberId, type: 'earn', points: earnedPoints, balanceAfter: balance,
            trxId: trx ? trx.id : null, note: multiplier > 1 ? `Poin sewa (Happy Hour ${multiplier}x)` : 'Poin sewa', timestamp: ts });
        }

        const spend = getMemberSpend3Months(memberId, trx ? [trx, ...transactions] : transactions, ts);
        const newTierId = computeMemberTier(spend).id;

        setMembers(prev => prev.map(x => x.id !== memberId ? x : {
          ...x,
          points: balance,
          tier: newTierId,
          lastTransactionAt: ts,
          lifetimeHours: (x.lifetimeHours || 0) + hoursPlayed,
        }));
        if (logs.length > 0) setPointLogs(prev => [...logs.reverse(), ...prev]);
      };

      // Manual point top-up, used to convert old paper vouchers into points.
      // Expired balance is cleared first (and logged), then the new points are added.
      // Counts as account activity, so the 60-day expiry timer restarts from now.
      const handleManualAddPoints = ({ memberId, points, voucherValue, note }) => {
        const m = members.find(x => x.id === memberId);
        if (!m || !(points > 0)) return;
        const ts = Date.now();
        const logs = [];
        let balance = m.points || 0;
        if (balance > 0 && isPointsExpired(m, ts)) {
          logs.push({ id: `plog_${ts}_exp`, memberId, type: 'expire', points: -balance, balanceAfter: 0, trxId: null,
            note: `Poin hangus (tidak ada transaksi ${POINT_EXPIRY_DAYS} hari)`, timestamp: ts });
          balance = 0;
        }
        balance += points;
        logs.push({ id: `plog_${ts}_man`, memberId, type: 'manual', points, balanceAfter: balance, trxId: null,
          note: `Konversi voucher${voucherValue ? ` ${formatCurrency(voucherValue)}` : ''}${note ? ` - ${note}` : ''}`,
          timestamp: ts, byRole: role });
        setMembers(prev => prev.map(x => x.id !== memberId ? x : { ...x, points: balance, lastTransactionAt: ts }));
        setPointLogs(prev => [...logs.reverse(), ...prev]);
      };

      // --- PROMO / HAPPY HOUR (cashier control) ---
      const handleTogglePromo = () => setPromo(p => ({ ...p, active: !p.active }));
      const handleSetPromoMultiplier = (value) => {
        const v = Math.min(10, Math.max(1, Number(value) || 1));
        setPromo(p => ({ ...p, multiplier: v }));
      };

      const handleCancelSession = (unitId) => {
        const unit = units.find(u => u.id === unitId);
        if (!unit || !unit.activeSession) return;

        // --- AUDIT LOG: record what this session WOULD have billed, so cancelled money is never invisible ---
        const session = unit.activeSession;
        const ts = Date.now();
        const member = session.memberId ? members.find(m => m.id === session.memberId) : null;
        const bill = computeCheckoutBreakdown(session, tiers[unit.tier], null, 0, ts, null);
        const elapsedMinutes = Math.max(0, Math.round((ts - session.startTime) / 60000));
        const bookedMinutes = session.type === 'prepaid' ? Math.round((session.endTime - session.startTime) / 60000) : null;
        setCancelLogs(prev => [{
          id: `cancel_${ts}`,
          timestamp: ts,
          unitId: unit.id,
          unitName: unit.name,
          tierName: tiers[unit.tier] ? tiers[unit.tier].name : '',
          sessionType: session.type,
          startTime: session.startTime,
          elapsedMinutes,
          bookedMinutes,
          prepaidTimeFinished: session.type === 'prepaid' && ts >= session.endTime,
          rentalAmount: bill.rentalTotal,
          fnbAmount: bill.fnbTotal,
          expectedTotal: bill.subtotal,
          fnbOrders: session.fnbOrders.map(o => ({ name: o.item.name, qty: o.qty, price: o.item.price })),
          memberName: member ? member.name : null,
          note: session.note || '',
          cancelledByRole: role,
        }, ...prev]);
        
        // Restore FnB stock if any was ordered but cancelled
        if (unit.activeSession.fnbOrders.length > 0) {
          const updatedInventory = [...inventory];
          unit.activeSession.fnbOrders.forEach(order => {
            const invItem = updatedInventory.find(i => i.id === order.item.id);
            if (invItem) invItem.stock += order.qty;
          });
          setInventory(updatedInventory);
        }
        
        setUnits(units.map(u => u.id === unitId ? { ...u, status: 'idle', activeSession: null } : u));
      };

      const handleAddFnbItem = (newItem) => {
        setInventory([...inventory, { ...newItem, id: `fnb_${Date.now()}` }]);
        setAddFnbModal(false);
      };

      const handleUpdateUnitName = (unitId, newName) => {
        setUnits(units.map(u => u.id === unitId ? { ...u, name: newName } : u));
      };

      const handleDeleteTransaction = (transactionId) => {
        const trxToDelete = transactions.find(t => t.id === transactionId);
        if (!trxToDelete) return;

        // Restore FnB stock if it was a mistake
        const itemsToRestore = trxToDelete.type === 'walk-in' ? trxToDelete.items : trxToDelete.fnbOrders;
        if (itemsToRestore && itemsToRestore.length > 0) {
          const updatedInventory = [...inventory];
          itemsToRestore.forEach(order => {
            const invItem = updatedInventory.find(i => i.id === order.item.id);
            if (invItem) invItem.stock += order.qty;
          });
          setInventory(updatedInventory);
        }

        setTransactions(transactions.filter(t => t.id !== transactionId));
      };

      const requestRoleSwitch = () => {
        if (role === 'admin') {
          // Switching down to staff never requires a PIN
          setRole('staff');
          if (activeTab === 'settings' || activeTab === 'reports') {
            setActiveTab('monitoring');
          }
        } else {
          // Switching up to admin requires the PIN
          setPinModalOpen(true);
        }
      };

      const handlePinSuccess = () => {
        setRole('admin');
        setPinModalOpen(false);
      };

      // --- SUB-COMPONENTS ---
      const SidebarItem = ({ icon: Icon, label, id, restricted }) => {
        if (restricted && role !== 'admin') return null;
        const active = activeTab === id;
        return (
          <button 
            onClick={() => setActiveTab(id)}
            className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 ${
              active 
                ? 'bg-yellow-400 text-slate-900 font-bold shadow-lg shadow-yellow-400/20' 
                : 'text-slate-400 hover:bg-slate-800 hover:text-white'
            }`}
          >
            <Icon size={20} className={active ? 'text-slate-900' : 'text-slate-400'} />
            <span>{label}</span>
          </button>
        );
      };

      return (
        <div className="min-h-screen bg-[#0B1120] text-slate-200 font-sans flex">
          {/* SIDEBAR */}
          <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col p-4 fixed h-full z-10 hidden md:flex">
            <div className="flex items-center space-x-3 px-2 mb-8 mt-2">
              <div className="bg-yellow-400 p-2 rounded-lg">
                <Play size={24} className="text-slate-900 fill-current" />
              </div>
              <div>
                <h1 className="text-xl font-black text-white tracking-wider">SKYZONE</h1>
                <p className="text-xs text-yellow-400 font-bold uppercase tracking-widest">Hub</p>
              </div>
            </div>

            <nav className="flex-1 space-y-2">
              <SidebarItem icon={Monitor} label="Live Monitoring" id="monitoring" />
              <SidebarItem icon={Coffee} label="FnB & Inventory" id="fnb" />
              <SidebarItem icon={Users} label="Members" id="members" />
              <SidebarItem icon={BarChart3} label="Financial Reports" id="reports" restricted={true} />
              {role === 'admin' && <SidebarItem icon={Settings} label="System Settings" id="settings" restricted={true} />}
            </nav>

            {/* Role Toggle for Demo Purposes */}
            <div className="mt-auto pt-4 border-t border-slate-800">
              <div className="flex items-center justify-between px-2 mb-2">
                <span className="text-xs font-semibold text-slate-500 uppercase">Current Role</span>
              </div>
              <button 
                onClick={requestRoleSwitch}
                className="w-full flex items-center space-x-2 px-3 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition"
              >
                <UserCircle size={18} className={role === 'admin' ? 'text-yellow-400' : 'text-blue-400'} />
                <span className="text-sm font-medium capitalize">{role}</span>
                <LogOut size={14} className="ml-auto text-slate-500" />
              </button>
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 md:ml-64 p-6 overflow-y-auto h-screen">
            
            {/* MOBILE HEADER */}
            <div className="md:hidden flex items-center justify-between bg-slate-900 p-4 rounded-xl mb-6 border border-slate-800">
              <div className="flex items-center space-x-2">
                <div className="bg-yellow-400 p-1.5 rounded-lg">
                  <Play size={18} className="text-slate-900 fill-current" />
                </div>
                <h1 className="text-lg font-black text-white">SKYZONE HUB</h1>
              </div>
              <button 
                onClick={requestRoleSwitch}
                className="flex items-center space-x-1 text-sm bg-slate-800 px-2 py-1 rounded-md"
              >
                <span className="capitalize text-yellow-400">{role}</span>
              </button>
            </div>

            {/* --- VIEW: LIVE MONITORING --- */}
            {activeTab === 'monitoring' && (
              <div className="space-y-6 animate-in">
                <PromoControl promo={promo} onToggle={handleTogglePromo} onSetMultiplier={handleSetPromoMultiplier} />
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Live Monitoring Matrix</h2>
                    <p className="text-slate-400 text-sm">Manage console sessions and active tabs.</p>
                  </div>
                  <div className="flex space-x-3">
                    <button 
                      onClick={() => setWalkInModal(true)}
                      className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center shadow-lg border border-slate-700 transition"
                    >
                      <Coffee size={16} className="mr-2 text-yellow-400" /> Walk-in POS
                    </button>
                    {role === 'admin' && (
                      <button 
                        onClick={() => setAddConsoleModal(true)}
                        className="bg-yellow-400 hover:bg-yellow-500 text-slate-900 px-4 py-2 rounded-lg text-sm font-bold flex items-center shadow-lg shadow-yellow-400/20 transition"
                      >
                        <Plus size={16} className="mr-2" /> Add Console
                      </button>
                    )}
                  </div>
                </div>

                {/* Matrix Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {units.map(unit => {
                    const isActive = unit.status === 'active';
                    const session = unit.activeSession;
                    const tier = tiers[unit.tier];
                    
                    let timeDisplay = "00:00:00";
                    let isTimeLow = false;
                    let currentEstCost = 0;

                    if (isActive && session) {
                      if (session.type === 'prepaid') {
                        const remaining = session.endTime - now;
                        if (remaining > 0) {
                          timeDisplay = formatTime(remaining);
                          isTimeLow = remaining < 300000; // Under 5 minutes
                        } else {
                          timeDisplay = "00:00:00";
                          isTimeLow = true; // Overtime, keep pulsing
                        }
                        currentEstCost = session.prePaidAmount;
                      } else {
                        const elapsed = now - session.startTime;
                        timeDisplay = formatTime(elapsed);
                        currentEstCost = calculateContinuousCost(elapsed / (1000 * 3600), tier);
                      }
                      
                      const fnbCost = session.fnbOrders.reduce((sum, order) => sum + (order.item.price * order.qty), 0);
                      currentEstCost += fnbCost;
                    }

                    return (
                      <div key={unit.id} className={`rounded-2xl border transition-all duration-300 overflow-hidden flex flex-col ${
                        isActive 
                          ? 'bg-slate-800 border-yellow-400/50 shadow-[0_0_15px_rgba(250,204,21,0.1)]' 
                          : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                      }`}>
                        {/* Card Header */}
                        <div className="p-4 border-b border-slate-800/50 flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-white text-lg">{unit.name}</h3>
                            <span className="text-xs text-slate-400 font-medium px-2 py-0.5 bg-slate-950 rounded-full inline-block mt-1">
                              {tier.name}
                            </span>
                          </div>
                          <div className={`px-2.5 py-1 rounded-md text-xs font-bold uppercase ${
                            isActive ? 'bg-yellow-400 text-slate-900' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {isActive ? 'In Use' : 'Idle'}
                          </div>
                        </div>

                        {/* Card Body */}
                        <div className="p-4 flex-1 flex flex-col justify-between">
                          {isActive ? (
                            <div className="space-y-4">
                              <div className="flex justify-between items-end">
                                <div>
                                  <p className="text-xs text-slate-400 mb-1">
                                    {session.type === 'prepaid' ? 'Remaining Time' : 'Elapsed Time'}
                                  </p>
                                  <div className={`text-3xl font-mono font-medium tracking-tight flex items-center ${isTimeLow ? 'text-red-400 animate-pulse' : 'text-white'}`}>
                                    <Clock size={20} className="mr-2 opacity-50" />
                                    {timeDisplay}
                                  </div>
                                </div>
                                <div className="text-right">
                                  <p className="text-xs text-slate-400 mb-1">Total Bill</p>
                                  <p className="text-lg font-bold text-yellow-400">{formatCurrency(currentEstCost)}</p>
                                </div>
                              </div>

                              {/* Interactive Session Note Area */}
                              <SessionNoteManager 
                                unit={unit} 
                                onUpdateNote={handleUpdateSessionNote} 
                              />
                              
                              <div className="flex gap-2">
                                <button 
                                  onClick={() => setCheckoutModalUnit(unit)}
                                  className="flex-1 bg-slate-900 hover:bg-slate-950 text-white border border-slate-700 py-2 rounded-lg text-sm font-semibold flex justify-center items-center transition px-2"
                                >
                                  <Square size={14} className="mr-1 text-red-400 fill-current" /> Stop
                                </button>
                                
                                {session.type === 'prepaid' && (
                                  <button 
                                    onClick={() => setExtendModalUnit(unit)}
                                    className="bg-slate-700 hover:bg-blue-600 hover:text-white text-slate-300 px-3 py-2 rounded-lg flex items-center justify-center transition tooltip-trigger"
                                    title="Extend Time"
                                  >
                                    <Timer size={16} className="text-blue-400 hover:text-white" />
                                  </button>
                                )}

                                <button 
                                  onClick={() => handleCancelSession(unit.id)}
                                  className="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg flex items-center justify-center transition tooltip-trigger"
                                  title="Cancel Session (No Bill)"
                                >
                                  <Ban size={16} className="text-red-400" />
                                </button>
                                <button 
                                  onClick={() => setFnbModalUnit(unit)}
                                  className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg flex items-center justify-center transition tooltip-trigger relative"
                                  title="Add Food/Drink"
                                >
                                  <ShoppingCart size={16} />
                                  {session.fnbOrders.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-yellow-400 text-slate-900 w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center">
                                      {session.fnbOrders.reduce((acc, curr) => acc + curr.qty, 0)}
                                    </span>
                                  )}
                                </button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex flex-col items-center justify-center py-6 h-[124px]">
                              <button 
                                onClick={() => setSessionModalUnit(unit)}
                                className="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-900 py-3 rounded-xl font-bold flex justify-center items-center transition shadow-lg shadow-yellow-400/10"
                              >
                                <Play size={18} className="mr-2 fill-current" /> Start Session
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* --- VIEW: FNB INVENTORY --- */}
            {activeTab === 'fnb' && (
              <div className="space-y-6 animate-in">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Inventory Management</h2>
                    <p className="text-slate-400 text-sm">Monitor stock levels and process walk-in sales.</p>
                  </div>
                  <div className="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Search size={16} className="text-slate-500" />
                      </div>
                      <input
                        type="text"
                        placeholder="Search F&B..."
                        value={fnbSearchTerm}
                        onChange={(e) => setFnbSearchTerm(e.target.value)}
                        className="bg-slate-900 border border-slate-700 text-sm rounded-lg pl-9 pr-3 py-2 text-white focus:outline-none focus:border-yellow-400 w-full sm:w-64 transition shadow-lg"
                      />
                    </div>
                    {role === 'admin' && (
                      <button 
                        onClick={() => setAddFnbModal(true)}
                        className="bg-yellow-400 hover:bg-yellow-500 text-slate-900 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center shadow-lg transition"
                      >
                        <Plus size={16} className="mr-2" /> Add Item
                      </button>
                    )}
                    <button 
                      onClick={() => setWalkInModal(true)}
                      className="bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center shadow-lg transition"
                    >
                      <ShoppingCart size={16} className="mr-2 text-yellow-400" /> Walk-in Cart
                    </button>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-950 text-slate-400">
                        <tr>
                          <th className="px-6 py-4 font-medium">Item Name</th>
                          <th className="px-6 py-4 font-medium">Category</th>
                          <th className="px-6 py-4 font-medium">Stock Level</th>
                          <th className="px-6 py-4 font-medium">Selling Price</th>
                          {role === 'admin' && <th className="px-6 py-4 font-medium">Cost (Modal)</th>}
                          <th className="px-6 py-4 font-medium text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/50">
                        {inventory
                          .filter(item => 
                            item.name.toLowerCase().includes(fnbSearchTerm.toLowerCase()) || 
                            item.category.toLowerCase().includes(fnbSearchTerm.toLowerCase())
                          )
                          .map(item => (
                          <tr key={item.id} className="hover:bg-slate-800/50 transition">
                            <td className="px-6 py-4 font-medium text-white flex items-center">
                              {item.name}
                              {item.stock <= item.alert && (
                                <span className="ml-2 bg-red-500/10 text-red-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold flex items-center border border-red-500/20">
                                  <AlertTriangle size={10} className="mr-1" /> Low Stock
                                </span>
                              )}
                            </td>
                            <td className="px-6 py-4">
                              <span className="px-2 py-1 bg-slate-800 rounded text-slate-300 text-xs">
                                {item.category}
                              </span>
                            </td>
                            <td className="px-6 py-4">
                              <div className="flex items-center space-x-2">
                                <button 
                                  onClick={() => handleAdjustStock(item.id, -1)}
                                  className="p-1 bg-slate-800 hover:bg-slate-700 hover:text-white text-slate-400 rounded-md transition"
                                  title="Deduct 1 Stock"
                                >
                                  <Minus size={14} />
                                </button>
                                <span className={`font-bold w-12 text-center text-sm ${item.stock <= item.alert ? 'text-red-400' : 'text-white'}`}>
                                  {item.stock}
                                </span>
                                <button 
                                  onClick={() => handleAdjustStock(item.id, 1)}
                                  className="p-1 bg-slate-800 hover:bg-slate-700 hover:text-white text-slate-400 rounded-md transition"
                                  title="Add 1 Stock"
                                >
                                  <Plus size={14} />
                                </button>
                              </div>
                            </td>
                            <td className="px-6 py-4 text-yellow-400 font-medium">{formatCurrency(item.price)}</td>
                            {role === 'admin' && <td className="px-6 py-4 text-slate-400">{formatCurrency(item.cost)}</td>}
                            <td className="px-6 py-4 text-right">
                              <div className="flex items-center justify-end space-x-2">
                                <button 
                                  onClick={() => handleQuickSellFnB(item)}
                                  disabled={item.stock === 0}
                                  className="bg-yellow-400/10 hover:bg-yellow-400/20 text-yellow-400 border border-yellow-400/30 px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center disabled:opacity-50 disabled:cursor-not-allowed transition"
                                >
                                  <Zap size={14} className="mr-1" /> Sell 1x (Cash)
                                </button>
                                {role === 'admin' && (
                                  <button 
                                    onClick={() => setDeleteFnbConfirm(item)}
                                    className="p-2 bg-slate-850 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-800 hover:border-red-500/30 rounded-lg transition"
                                    title="Remove Item completely"
                                  >
                                    <Trash2 size={14} />
                                  </button>
                                )}
                              </div>
                            </td>
                          </tr>
                        ))}
                        {inventory.filter(item => item.name.toLowerCase().includes(fnbSearchTerm.toLowerCase()) || item.category.toLowerCase().includes(fnbSearchTerm.toLowerCase())).length === 0 && (
                          <tr>
                            <td colSpan={role === 'admin' ? "6" : "5"} className="text-center py-8 text-slate-500">
                              No items match your search.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* --- VIEW: MEMBERSHIP PROGRAM --- */}
            {activeTab === 'members' && (
              <MembersView
                members={members}
                transactions={transactions}
                onViewLog={(member) => setPointLogMember(member)}
                onAddPoints={(member) => setAddPointsMember(member)}
                searchTerm={memberSearchTerm}
                onSearchChange={setMemberSearchTerm}
                onAddMember={() => setAddMemberModal(true)}
                onDeleteMember={(member) => setDeleteMemberConfirm(member)}
              />
            )}

            {/* --- VIEW: FINANCIAL REPORTS --- */}
            {activeTab === 'reports' && role === 'admin' && (
              <DashboardAnalytics 
                transactions={transactions} 
                inventory={inventory} 
                cancelLogs={cancelLogs}
                onDeleteTransaction={(trxId) => setDeleteTrxPending(trxId)}
                onViewReceipt={setReceiptTrx}
              />
            )}

            {/* --- VIEW: SYSTEM SETTINGS --- */}
            {activeTab === 'settings' && role === 'admin' && (
              <SystemSettings 
                tiers={tiers} 
                onUpdateTier={handleUpdateTierRate}
                units={units}
                onUpdateUnitName={handleUpdateUnitName}
              />
            )}

          </div>

          {/* --- MODALS --- */}
          
          {/* Start Session Modal */}
          {sessionModalUnit && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
                <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                  <h3 className="font-bold text-white flex items-center text-lg">
                    <Play size={18} className="mr-2 text-yellow-400 fill-current" />
                    Start {sessionModalUnit.name}
                  </h3>
                  <button onClick={() => setSessionModalUnit(null)} className="text-slate-400 hover:text-white">
                    <X size={20} />
                  </button>
                </div>
                <StartSessionForm 
                  unit={sessionModalUnit} 
                  onStart={handleStartSession} 
                  tierInfo={tiers[sessionModalUnit.tier]}
                  members={members}
                />
              </div>
            </div>
          )}

          {/* Extend Time Modal */}
          {extendModalUnit && (
            <ExtendTimeModal
              unit={extendModalUnit}
              tierInfo={tiers[extendModalUnit.tier]}
              onClose={() => setExtendModalUnit(null)}
              onExtend={handleExtendTime}
            />
          )}

          {/* Add FnB Modal (Cart) */}
          {(fnbModalUnit || walkInModal) && (
            <AddFnbModal 
              isOpen={!!fnbModalUnit || walkInModal}
              unit={fnbModalUnit}
              inventory={inventory}
              isWalkIn={walkInModal}
              members={members}
              onClose={() => { setFnbModalUnit(null); setWalkInModal(false); }}
              onAdd={(items, memberId, pointsToRedeem) => handleAddFnB(fnbModalUnit ? fnbModalUnit.id : 'walk-in', items, memberId, pointsToRedeem)}
            />
          )}

          {/* Checkout Modal */}
          {checkoutModalUnit && (() => {
            // Re-derive the live unit from state so removing an F&B item below updates this modal immediately
            const liveCheckoutUnit = units.find(u => u.id === checkoutModalUnit.id) || checkoutModalUnit;
            if (!liveCheckoutUnit.activeSession) return null;
            return (
              <CheckoutModal 
                unit={liveCheckoutUnit}
                tierInfo={tiers[liveCheckoutUnit.tier]}
                now={now}
                members={members}
                promo={promo}
                onClose={() => setCheckoutModalUnit(null)}
                onConfirm={(method, pointsToRedeem) => handleCheckout(liveCheckoutUnit.id, method, pointsToRedeem)}
                onRemoveFnbOrder={(orderIndex) => handleRemoveFnbOrder(liveCheckoutUnit.id, orderIndex)}
              />
            );
          })()}

          {/* Add Console Modal (Admin) */}
          {addConsoleModal && (
            <AddConsoleModal 
              tiers={tiers}
              onClose={() => setAddConsoleModal(false)}
              onAdd={handleAddConsole}
            />
          )}

          {/* Add Fnb Item Modal (Admin) */}
          {addFnbModal && (
            <AddFnbItemModal
              onClose={() => setAddFnbModal(false)}
              onAdd={handleAddFnbItem}
            />
          )}

          {/* Delete F&B Item Confirmation Modal */}
          {deleteFnbConfirm && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
                <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                  <h3 className="font-bold text-white flex items-center text-lg">
                    <AlertTriangle size={18} className="mr-2 text-red-500 animate-pulse" /> Confirm Delete
                  </h3>
                  <button onClick={() => setDeleteFnbConfirm(null)} className="text-slate-400 hover:text-white">
                    <X size={20} />
                  </button>
                </div>
                <div className="p-6 space-y-4">
                  <p className="text-slate-300">
                    Are you sure you want to remove <strong className="text-white">{deleteFnbConfirm.name}</strong> from the system inventory list?
                  </p>
                  <p className="text-xs text-slate-500 bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                    Note: This does not affect existing finalized transactions in your reports, but it will remove the item from active sales and POS lists immediately.
                  </p>
                  <div className="flex space-x-3 mt-4">
                    <button
                      onClick={() => setDeleteFnbConfirm(null)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-semibold transition"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={() => handleDeleteFnbItem(deleteFnbConfirm.id)}
                      className="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg text-sm font-semibold transition"
                    >
                      Delete Item
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Add Member Modal */}
          {addMemberModal && (
            <AddMemberModal
              onClose={() => setAddMemberModal(false)}
              onAdd={handleAddMember}
            />
          )}

          {/* Manual Add Points form (voucher conversion) */}
          {addPointsMember && (
            <AddPointsModal
              member={members.find(m => m.id === addPointsMember.id) || addPointsMember}
              onClose={() => setAddPointsMember(null)}
              onSubmit={(data) => {
                setManualPointPending({ memberId: addPointsMember.id, memberName: addPointsMember.name, ...data });
                setAddPointsMember(null);
              }}
            />
          )}

          {/* Admin PIN required before manual points are credited */}
          {manualPointPending && (
            <PinModal
              correctPin={ADMIN_PIN}
              title="PIN Admin: Tambah Poin"
              description={`Masukkan PIN admin untuk menambah ${manualPointPending.points.toLocaleString('id-ID')} poin ke ${manualPointPending.memberName}.`}
              onClose={() => setManualPointPending(null)}
              onSuccess={() => { handleManualAddPoints(manualPointPending); setManualPointPending(null); }}
            />
          )}

          {/* Member Point Log Modal */}
          {pointLogMember && (
            <PointLogModal
              member={members.find(m => m.id === pointLogMember.id) || pointLogMember}
              logs={pointLogs.filter(l => l.memberId === pointLogMember.id)}
              onClose={() => setPointLogMember(null)}
            />
          )}

          {/* Delete Member Confirmation Modal */}
          {deleteMemberConfirm && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in">
                <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                  <h3 className="font-bold text-white flex items-center text-lg">
                    <AlertTriangle size={18} className="mr-2 text-red-500 animate-pulse" /> Confirm Delete
                  </h3>
                  <button onClick={() => setDeleteMemberConfirm(null)} className="text-slate-400 hover:text-white">
                    <X size={20} />
                  </button>
                </div>
                <div className="p-6 space-y-4">
                  <p className="text-slate-300">
                    Hapus member <strong className="text-white">{deleteMemberConfirm.name}</strong> dari sistem? Saldo poin dan riwayat tier member ini akan ikut terhapus.
                  </p>
                  <p className="text-xs text-slate-500 bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                    Catatan: Transaksi lama milik member ini di laporan keuangan tidak akan ikut terhapus.
                  </p>
                  <div className="flex space-x-3 mt-4">
                    <button
                      onClick={() => setDeleteMemberConfirm(null)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-semibold transition"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={() => handleDeleteMember(deleteMemberConfirm.id)}
                      className="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg text-sm font-semibold transition"
                    >
                      Delete Member
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Admin PIN required before a transaction can be deleted */}
          {deleteTrxPending && (() => {
            const trx = transactions.find(t => t.id === deleteTrxPending);
            const label = trx ? `${trx.type === 'walk-in' ? 'Walk-in F&B' : trx.unit_name} • ${formatCurrency(trx.grandTotal)}` : 'transaksi ini';
            return (
              <PinModal
                correctPin={ADMIN_PIN}
                title="PIN Admin: Hapus Transaksi"
                description={`Masukkan PIN admin untuk menghapus ${label}. Tindakan ini tidak bisa dibatalkan.`}
                onClose={() => setDeleteTrxPending(null)}
                onSuccess={() => { handleDeleteTransaction(deleteTrxPending); setDeleteTrxPending(null); }}
              />
            );
          })()}

          {/* Admin PIN Modal */}
          {pinModalOpen && (
            <PinModal
              correctPin={ADMIN_PIN}
              onClose={() => setPinModalOpen(false)}
              onSuccess={handlePinSuccess}
            />
          )}

          {/* Receipt / Struk Export Modal - shown right after checkout, or when re-printing from history */}
          {receiptTrx && (
            <ReceiptModal
              trx={receiptTrx}
              onClose={() => setReceiptTrx(null)}
            />
          )}
        </div>
      );
    }

    function PinModal({ correctPin, onClose, onSuccess, title = 'Admin PIN Required', description = 'Enter the admin PIN to switch roles.' }) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState(false);

      const handleDigit = (digit) => {
        if (pin.length >= correctPin.length) return;
        setError(false);
        const next = pin + digit;
        setPin(next);
        if (next.length === correctPin.length) {
          if (next === correctPin) {
            setTimeout(() => onSuccess(), 150);
          } else {
            setError(true);
            setTimeout(() => setPin(''), 400);
          }
        }
      };

      const handleBackspace = () => {
        setError(false);
        setPin(pin.slice(0, -1));
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
          else if (e.key === 'Backspace') handleBackspace();
          else if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      });

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs shadow-2xl overflow-hidden animate-in">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
              <h3 className="font-bold text-white flex items-center">
                <UserCircle size={18} className="mr-2 text-yellow-400" />
                {title}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={20} /></button>
            </div>

            <div className="p-6 space-y-5">
              <p className="text-sm text-slate-400 text-center">{description}</p>

              {/* PIN dots */}
              <div className="flex justify-center space-x-3">
                {Array(correctPin.length).fill(0).map((_, i) => (
                  <div
                    key={i}
                    className={`w-4 h-4 rounded-full border-2 transition-all ${
                      i < pin.length
                        ? (error ? 'bg-red-500 border-red-500' : 'bg-yellow-400 border-yellow-400')
                        : 'border-slate-600'
                    }`}
                  />
                ))}
              </div>
              {error && (
                <p className="text-xs text-red-400 text-center -mt-3">Incorrect PIN, try again.</p>
              )}

              {/* Numpad */}
              <div className="grid grid-cols-3 gap-3">
                {['1','2','3','4','5','6','7','8','9'].map((d) => (
                  <button
                    key={d}
                    type="button"
                    onClick={() => handleDigit(d)}
                    className="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-lg transition"
                  >
                    {d}
                  </button>
                ))}
                <button
                  type="button"
                  onClick={onClose}
                  className="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 font-semibold text-sm transition"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  onClick={() => handleDigit('0')}
                  className="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-lg transition"
                >
                  0
                </button>
                <button
                  type="button"
                  onClick={handleBackspace}
                  className="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 font-semibold text-sm transition"
                >
                  ⌫
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ReceiptModal({ trx, onClose }) {
      const receiptRef = useRef(null);
      const [exporting, setExporting] = useState(false);

      const orderedItems = trx.type === 'walk-in' ? trx.items : trx.fnbOrders;
      const receiptNo = trx.id.replace('trx_', '').slice(-8).toUpperCase();
      const dateObj = new Date(trx.timestamp);

      const captureCanvas = async () => {
        if (!window.html2canvas) {
          alert('Library export belum siap, pastikan koneksi internet aktif lalu coba lagi.');
          return null;
        }
        const node = receiptRef.current;
        return await window.html2canvas(node, {
          backgroundColor: '#ffffff',
          scale: 2,
          useCORS: true,
          scrollX: 0,
          scrollY: 0,
          windowWidth: node.scrollWidth,
          windowHeight: node.scrollHeight,
          width: node.scrollWidth,
          height: node.scrollHeight,
        });
      };

      const handleDownloadPNG = async () => {
        setExporting(true);
        try {
          const canvas = await captureCanvas();
          if (!canvas) return;
          const link = document.createElement('a');
          link.download = `Struk-${receiptNo}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error(err);
          alert('Gagal export struk ke PNG.');
        } finally {
          setExporting(false);
        }
      };

      const handleDownloadPDF = async () => {
        setExporting(true);
        try {
          const canvas = await captureCanvas();
          if (!canvas || !window.jspdf) {
            if (!window.jspdf) alert('Library PDF belum siap, pastikan koneksi internet aktif lalu coba lagi.');
            return;
          }
          const { jsPDF } = window.jspdf;
          const imgData = canvas.toDataURL('image/png');
          const pdfWidth = 80; // mm - standard thermal receipt width
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: [pdfWidth, pdfHeight],
          });
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Struk-${receiptNo}.pdf`);
        } catch (err) {
          console.error(err);
          alert('Gagal export struk ke PDF.');
        } finally {
          setExporting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden animate-in flex flex-col max-h-[90vh]">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
              <h3 className="font-bold text-white flex items-center">
                <Printer size={18} className="mr-2 text-yellow-400" />
                Struk Transaksi
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={20} /></button>
            </div>

            <div className="p-5 overflow-y-auto bg-slate-800/40">
              {/* The receipt itself - this exact element is captured when exporting to PNG/PDF */}
              <div ref={receiptRef} className="bg-white text-slate-900 mx-auto p-6 font-mono text-xs" style={{ width: '320px', lineHeight: '1.6' }}>
                <div className="text-center mb-3">
                  <div className="font-black text-base tracking-wider">SKYZONE HUB</div>
                  <div className="text-[10px] text-slate-600">PS Rental &amp; F&amp;B</div>
                </div>
                <div className="border-t border-dashed border-slate-400 my-2"></div>
                <div className="flex justify-between text-[10px]">
                  <span>No:</span><span>{receiptNo}</span>
                </div>
                <div className="flex justify-between text-[10px]">
                  <span>Tanggal:</span><span>{dateObj.toLocaleDateString('id-ID')} {dateObj.toLocaleTimeString('id-ID')}</span>
                </div>
                <div className="flex justify-between text-[10px]">
                  <span>Jenis:</span><span>{trx.type === 'walk-in' ? 'Walk-in F&B' : `Sewa - ${trx.unit_name}`}</span>
                </div>
                {trx.memberName && (
                  <div className="flex justify-between text-[10px]">
                    <span>Member:</span>
